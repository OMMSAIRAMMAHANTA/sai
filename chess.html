<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sai's Chess | Gaming Lab</title>
    
    <!-- Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts Merged -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-accent: #00eaff;
            --text-main: #ffffff;
            --bg-dark: #050b14;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            color: var(--text-main);
            overflow-x: hidden;
            background-color: var(--bg-dark);
            background: linear-gradient(135deg, rgba(5,11,20,0.92) 0%, rgba(10,25,47,0.85) 100%), url('https://image2url.com/images/1763374021173-7883e334-bb59-434f-a32d-83e8604794f2.jpeg') no-repeat center center/cover;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Ambient Background FX */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px; z-index: -1; pointer-events: none; opacity: 0.5;
        }
        .bg-glow {
            position: fixed; top: 50%; left: 50%; width: 80vw; height: 80vw;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(0, 234, 255, 0.05) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%; z-index: -2;
        }

        /* Navigation */
        .top-nav {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,234,255,0.2);
            z-index: 10;
        }
        .back-btn {
            color: var(--text-main); text-decoration: none; font-size: 1.1rem;
            display: flex; align-items: center; gap: 10px; transition: 0.3s;
        }
        .back-btn:hover { color: var(--primary-accent); text-shadow: 0 0 10px var(--primary-accent); }

        /* Chess Specifics */
        .game-wrapper {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 40px 20px;
        }

        .app-layout { display: flex; flex-direction: row; align-items: flex-start; justify-content: center; gap: 50px; width: 100%; max-width:1100px; opacity: 0; transition: opacity 1s; margin: auto 0; }
        .board-column { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; max-width: 500px; }
        .flipped-layout { flex-direction: column-reverse; }
        
        .player-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; background: rgba(20,20,25,0.8); padding: 15px 30px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); transition: all 0.4s; box-sizing: border-box;}
        .player-name { font-weight: bold; color: #aaa; text-transform: uppercase; font-size: 1.1rem; letter-spacing: 2px;}
        .timer-display { font-family: 'Courier New', monospace; font-size: 1.8rem; font-weight: 900; color: #fff; }
        
        .active-turn { border-color: var(--primary-accent); background: rgba(0,234,255,0.1); box-shadow: 0 0 30px rgba(0, 234, 255, 0.3); transform: scale(1.05); }
        .active-turn .timer-display { color: var(--primary-accent); text-shadow: 0 0 15px var(--primary-accent); }
        
        #board-wrapper { position: relative; width: 100%; aspect-ratio: 1 / 1; transform: rotateX(8deg); transition: transform 0.4s; box-shadow: 0 50px 100px rgba(0,0,0,1); border-radius: 8px; perspective: 1000px;}
        #chess-board { width: 100%; height: 100%; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); border: 10px solid #1a1a1a; border-radius: 8px; background: #000; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: inset 0 0 20px rgba(0,0,0,0.8);}
        
        .flipped-board { transform: rotate(180deg) !important; }
        .flipped-board .square { transform: rotate(180deg) !important; }
        
        .square { position: relative; width: 100%; height: 100%; overflow: hidden; cursor: pointer; transition: background-color 0.2s;}
        .sq-white { background-color: #d1d1b6; }
        .sq-black { background-color: #5c7a44; }
        .sq-selected { background-color: #baca44 !important; box-shadow: inset 0 0 30px rgba(0,0,0,0.8); }
        .king-in-check { background-color: #ff4444 !important; animation: pulse-red 0.6s infinite; }
        
        .piece-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; filter: drop-shadow(0 8px 6px rgba(0,0,0,0.7)); animation: dropIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        .valid-move::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 30%; height: 30%; background-color: rgba(0, 0, 0, 0.4); border-radius: 50%; }
        .valid-capture::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 8px solid rgba(0, 0, 0, 0.3); border-radius: 50%; box-sizing: border-box; }
        
        .chess-sidebar { width: 340px; background: rgba(15,15,20,0.9); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; gap: 20px; margin: auto 0; box-shadow: 0 20px 50px rgba(0,0,0,0.9); backdrop-filter: blur(20px);}
        .graveyard-section { background: rgba(0,0,0,0.5); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .graveyard-title { font-size: 0.9rem; color: #888; margin-bottom: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;}
        .graveyard { display: flex; flex-wrap: wrap; gap: 2px; min-height: 40px; }
        .dead-piece-img { width: 35px; height: 35px; filter: grayscale(0.5); animation: dropIn 0.3s; }
        
        #chess-status { text-align: center; font-size: 1.6rem; font-weight: 800; color: var(--primary-accent); text-shadow: 0 0 15px rgba(0,234,255,0.4); }
        
        .sidebar-btns { display: flex; gap: 15px; flex-wrap: wrap; }
        .btn-control { flex: 1; padding: 15px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1.1rem; transition: 0.3s; }
        .btn-flip { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
        .btn-flip:hover { background: rgba(255,255,255,0.2); transform: translateY(-3px);}
        .btn-restart { background: var(--primary-accent); color: black; box-shadow: 0 0 15px rgba(0,234,255,0.3);}
        .btn-restart:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 0 25px rgba(0,234,255,0.6);}
        .btn-menu { background: transparent; color: var(--text-muted); width: 100%; border: 1px solid rgba(255,255,255,0.1); }
        .btn-menu:hover { background: rgba(255,255,255,0.05); color: white;}
        
        #chess-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3,5,10,0.95); backdrop-filter: blur(20px); z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s ease-out; }
        #chess-overlay h1 { font-size: 3.5rem; margin: 0; color: white; text-shadow: 0 0 30px var(--primary-accent); font-weight: 800; letter-spacing: 2px; text-transform: uppercase;}
        #chess-main-menu { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 20px; margin-top: 50px;}
        
        .menu-btn { width: 90%; max-width: 400px; background: var(--primary-accent); color: black; padding: 20px; border-radius: 50px; font-size: 1.4rem; border: none; cursor: pointer; font-weight: 800; transition: 0.3s; box-shadow: 0 0 25px rgba(0,234,255,0.3); letter-spacing: 2px;}
        .menu-btn:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(0,234,255,0.7); background: #fff;}
        .difficulty-btn { width: 250px; background: rgba(255,255,255,0.05); color: white; padding: 15px; border-radius: 50px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; transition: 0.3s; font-weight: bold; font-size: 1.1rem; letter-spacing: 1px;}
        .difficulty-btn:hover { background: rgba(255,255,255,0.1); transform: scale(1.05); border-color: var(--primary-accent); }
        .hidden { display: none !important; }

        @media (max-width: 900px) {
            .app-layout { flex-direction: column; align-items: center;}
            .board-column { width: 95%; max-width: 100%; }
            .chess-sidebar { width: 95%; flex-direction: row; flex-wrap: wrap; }
            .graveyard-section { flex: 1; min-width: 45%; }
            #chess-overlay h1 { font-size: 2.5rem !important; }
        }

        @keyframes dropIn { 0% { transform: translateY(-100px) scale(0.3); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
        @keyframes pulse-red { 0%, 100% { background-color: #aa0000; box-shadow: 0 0 20px #aa0000; } 50% { background-color: #ff4444; box-shadow: 0 0 40px #ff4444;} }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div class="bg-glow"></div>

    <nav class="top-nav">
        <a href="games.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Lab Terminal</a>
        <h2 style="margin:0; font-weight: 700; letter-spacing: 2px; color: var(--primary-accent); text-transform: uppercase;">Sai's Chess</h2>
    </nav>

    <!-- Overlay Menu -->
    <div id="chess-overlay">
        <h1>SAI'S CHESS</h1>
        <p style="color:var(--primary-accent); font-size:1.2rem; margin-bottom:40px; letter-spacing:4px; font-weight:bold;">ULTIMATE EDITION</p>
        <div id="chess-main-menu">
            <button class="menu-btn" onclick="showChessDifficulty()">VS COMPUTER (AI)</button>
            <button class="menu-btn" onclick="startChessFriend()" style="background:#e0e0e0; color:#000;">LOCAL MULTIPLAYER</button>
            <button class="menu-btn" onclick="window.location.href='games.html'" style="background:transparent; border:2px solid #555; color:#aaa; box-shadow:none;">EXIT TO LAB</button>
        </div>
        <div id="chess-difficulty-menu" class="hidden" style="display:flex; flex-direction:column; align-items:center;">
            <button class="difficulty-btn" onclick="startChessAI('normal')">CASUAL AI</button>
            <button class="difficulty-btn" onclick="startChessAI('moderate')" style="border-color:var(--primary-accent); color:var(--primary-accent);">MODERATE AI</button>
            <button class="difficulty-btn" onclick="startChessAI('high')" style="border-color:#ff4444; color:#ff4444; text-shadow:0 0 5px rgba(255,0,0,0.5);">HARDCORE AI</button>
            <button class="difficulty-btn" onclick="hideChessDifficulty()" style="background:transparent; border:none; margin-top:20px; color:#888;">&larr; BACK</button>
        </div>
    </div>

    <!-- Main Game Area -->
    <div class="game-wrapper">
        <div class="app-layout" id="chess-ui">
            <!-- Board Section -->
            <div class="board-column">
                <div id="black-bar" class="player-bar">
                    <div class="player-name" id="name-black">Black Player</div>
                    <div id="timer-black" class="timer-display">00:00</div>
                </div>
                <div id="board-wrapper">
                    <div id="chess-board"></div>
                </div>
                <div id="white-bar" class="player-bar active-turn">
                    <div class="player-name" id="name-white">White Player</div>
                    <div id="timer-white" class="timer-display">00:00</div>
                </div>
            </div>
            
            <!-- Sidebar -->
            <div class="chess-sidebar">
                <div id="chess-status">White's Turn</div>
                <hr style="border-color:#333; width:100%; margin: 5px 0;">
                <div class="graveyard-section">
                    <div class="graveyard-title">White's Captured</div>
                    <div id="grave-white" class="graveyard"></div>
                </div>
                <div class="graveyard-section">
                    <div class="graveyard-title">Black's Captured</div>
                    <div id="grave-black" class="graveyard"></div>
                </div>
                <div class="sidebar-btns">
                    <button onclick="flipBoard()" class="btn-control btn-flip"><i class="fa-solid fa-arrows-rotate"></i> FLIP</button>
                    <button onclick="resetChess()" class="btn-control btn-restart"><i class="fa-solid fa-rotate-left"></i> RESTART</button>
                </div>
                <button onclick="showChessOverlay()" class="btn-control btn-menu">SYSTEM MENU</button>
            </div>
        </div>
    </div>

    <script>
        let chessBoard = [], chessTurn = 'white', chessSelected = null, chessActive = false;
        let chessMode = 'friend', chessAI = 'normal';
        let timeW = 0, timeB = 0, chessTimer = null;

        // Custom Pieces mapping
        const pieces = {
            'P': 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg',
            'N': 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
            'B': 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg',
            'R': 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
            'Q': 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg',
            'K': 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg',
            'p': 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg',
            'n': 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
            'b': 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg',
            'r': 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg',
            'q': 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg',
            'k': 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg'
        };

        const initialChess = [
            ['r','n','b','q','k','b','n','r'], ['p','p','p','p','p','p','p','p'],
            ['','','','','','','',''], ['','','','','','','',''],
            ['','','','','','','',''], ['','','','','','','',''],
            ['P','P','P','P','P','P','P','P'], ['R','N','B','Q','K','B','N','R']
        ];

        function showChessDifficulty() { 
            document.getElementById('chess-main-menu').classList.add('hidden'); 
            document.getElementById('chess-difficulty-menu').classList.remove('hidden'); 
        }
        function hideChessDifficulty() { 
            document.getElementById('chess-main-menu').classList.remove('hidden'); 
            document.getElementById('chess-difficulty-menu').classList.add('hidden'); 
        }
        
        function showChessOverlay() {
            const ov = document.getElementById('chess-overlay');
            ov.style.display = 'flex'; ov.style.opacity = 1;
            document.getElementById('chess-ui').style.opacity = 0;
            hideChessDifficulty();
            chessActive = false; clearInterval(chessTimer);
        }

        function startChessFriend() { 
            chessMode = 'friend'; 
            document.getElementById('name-black').innerText = "Black Player";
            launchChess(); 
        }
        
        function startChessAI(level) { 
            chessMode = 'computer'; 
            chessAI = level; 
            document.getElementById('name-black').innerText = "AI System (Black)";
            launchChess(); 
        }

        function launchChess() {
            const ov = document.getElementById('chess-overlay');
            ov.style.opacity = 0;
            setTimeout(() => { 
                ov.style.display = 'none'; 
                document.getElementById('chess-ui').style.opacity = 1; 
            }, 500);
            resetChess();
        }

        function resetChess() {
            chessBoard = JSON.parse(JSON.stringify(initialChess));
            chessTurn = 'white'; chessSelected = null; chessActive = true;
            clearInterval(chessTimer); timeW = 0; timeB = 0; updateChessTimer(); startChessTimer();
            document.getElementById('grave-white').innerHTML = ''; document.getElementById('grave-black').innerHTML = '';
            document.getElementById('white-bar').classList.add('active-turn'); document.getElementById('black-bar').classList.remove('active-turn');
            document.getElementById('chess-status').innerText = "White's Turn"; document.getElementById('chess-status').style.color = "var(--primary-accent)";
            document.getElementById('board-wrapper').className = '';
            document.getElementById('chess-board').classList.remove('flipped-board');
            document.querySelector('.board-column').classList.remove('flipped-layout');
            // Ensure UI clear before redraw
            document.getElementById('chess-board').innerHTML = '';
            drawChessBoard();
        }

        function flipBoard() {
            document.getElementById('chess-board').classList.toggle('flipped-board');
            document.querySelector('.board-column').classList.toggle('flipped-layout');
        }

        function startChessTimer() {
            if(chessTimer) clearInterval(chessTimer);
            chessTimer = setInterval(() => {
                if(!chessActive) return;
                if(chessTurn === 'white') timeW++; else timeB++;
                updateChessTimer();
            }, 1000);
        }
        
        function updateChessTimer() {
            const fmt = s => `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;
            document.getElementById('timer-white').innerText = fmt(timeW);
            document.getElementById('timer-black').innerText = fmt(timeB);
        }

        function drawChessBoard() {
            const boardDiv = document.getElementById('chess-board');
            const inCheck = isKingInCheck(chessTurn);

            // Flicker Fix: Sirf ek baar divs banenge
            if (boardDiv.children.length === 0) {
                for(let r=0; r<8; r++) {
                    for(let c=0; c<8; c++) {
                        const sq = document.createElement('div');
                        sq.id = `sq-${r}-${c}`;
                        sq.onclick = () => handleChessClick(r, c);
                        boardDiv.appendChild(sq);
                    }
                }
            }

            for(let r=0; r<8; r++) {
                for(let c=0; c<8; c++) {
                    const sq = document.getElementById(`sq-${r}-${c}`);
                    
                    // Purani classes hata kar naya setup
                    sq.className = `square ${(r+c)%2===0 ? 'sq-white' : 'sq-black'}`;
                    
                    const p = chessBoard[r][c];
                    let existingImg = sq.querySelector('img');

                    // Smart Update: Sirf required elements change karo
                    if(p) {
                        if (existingImg) {
                            if (existingImg.src !== pieces[p]) existingImg.src = pieces[p];
                        } else {
                            const img = document.createElement('img');
                            img.src = pieces[p]; 
                            img.className = 'piece-img';
                            sq.appendChild(img);
                        }
                        
                        if(inCheck && p.toLowerCase() === 'k' && (p === p.toUpperCase()) === (chessTurn === 'white')) {
                            sq.classList.add('king-in-check');
                        }
                    } else {
                        if (existingImg) sq.removeChild(existingImg);
                    }
                    
                    if(chessSelected && chessSelected.r === r && chessSelected.c === c) sq.classList.add('sq-selected');
                    if(chessSelected && chessActive && (chessMode === 'friend' || chessTurn === 'white')) {
                        if(isMoveLegal(chessSelected.r, chessSelected.c, r, c)) {
                            sq.classList.add(chessBoard[r][c] ? 'valid-capture' : 'valid-move');
                        }
                    }
                }
            }
        }

        function handleChessClick(r, c) {
            if(!chessActive) return;
            if(chessMode === 'computer' && chessTurn === 'black') return; // Block input if AI turn
            const clickedPiece = chessBoard[r][c];
            const isWhitePiece = clickedPiece && clickedPiece === clickedPiece.toUpperCase();

            if(!chessSelected) {
                if(!clickedPiece) return;
                if((chessTurn === 'white' && !isWhitePiece) || (chessTurn === 'black' && isWhitePiece)) return;
                chessSelected = {r, c}; drawChessBoard();
            } else {
                if(chessSelected.r === r && chessSelected.c === c) { chessSelected = null; drawChessBoard(); return; }
                if(clickedPiece && ((chessTurn === 'white' && isWhitePiece) || (chessTurn === 'black' && !isWhitePiece))) {
                    chessSelected = {r, c}; drawChessBoard(); return;
                }
                if(isMoveLegal(chessSelected.r, chessSelected.c, r, c)) {
                    makeChessMove(chessSelected.r, chessSelected.c, r, c);
                } else { chessSelected = null; drawChessBoard(); }
            }
        }

        function makeChessMove(r1, c1, r2, c2) {
            const moving = chessBoard[r1][c1];
            const target = chessBoard[r2][c2];

            if(target) {
                const grave = target === target.toUpperCase() ? document.getElementById('grave-white') : document.getElementById('grave-black');
                const img = document.createElement('img'); img.src = pieces[target]; img.className = 'dead-piece-img';
                grave.appendChild(img);
            }

            chessBoard[r2][c2] = moving; chessBoard[r1][c1] = '';
            chessTurn = chessTurn === 'white' ? 'black' : 'white';
            
            if(chessTurn === 'white') {
                document.getElementById('white-bar').classList.add('active-turn'); document.getElementById('black-bar').classList.remove('active-turn');
                document.getElementById('chess-status').innerText = "White's Turn";
            } else {
                document.getElementById('white-bar').classList.remove('active-turn'); document.getElementById('black-bar').classList.add('active-turn');
                document.getElementById('chess-status').innerText = "Black's Turn";
            }

            const inCheck = isKingInCheck(chessTurn);
            const hasMoves = hasValidMoves(chessTurn);
            let gameOver = false;

            if(inCheck) {
                if(!hasMoves) { endChessGame(chessTurn === 'white' ? 'black' : 'white'); gameOver = true; }
                else { document.getElementById('chess-status').innerText = "CHECK!"; document.getElementById('chess-status').style.color = "#ff4444"; }
            } else {
                document.getElementById('chess-status').style.color = "var(--primary-accent)";
                if(!hasMoves) { document.getElementById('chess-status').innerText = "DRAW (Stalemate)"; chessActive = false; clearInterval(chessTimer); gameOver = true; }
            }

            chessSelected = null; drawChessBoard();
            if(!gameOver && chessActive && chessMode === 'computer' && chessTurn === 'black') { 
                setTimeout(chessAIThink, 500); 
            }
        }

        function endChessGame(winner) {
            chessActive = false; clearInterval(chessTimer);
            document.getElementById('chess-status').innerHTML = `<span style="color:gold">CHECKMATE! ${winner.toUpperCase()} WINS</span>`;
        }

        function chessAIThink() {
            let bestMove = null;
            if(chessAI === 'normal') {
                const moves = getAllMoves('black');
                if(moves.length) bestMove = moves[Math.floor(Math.random() * moves.length)];
            } else if(chessAI === 'moderate') { 
                bestMove = getBestMove(1); 
            } else { 
                bestMove = getBestMove(2); 
            }
            if(bestMove) makeChessMove(bestMove.r1, bestMove.c1, bestMove.r2, bestMove.c2);
        }

        const pieceValues = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 };
        
        function getBestMove(depth) {
            const moves = getAllMoves('black');
            let bestScore = -Infinity; let bestMove = moves[0];
            moves.sort(() => Math.random() - 0.5);
            for(const move of moves) {
                const t = chessBoard[move.r2][move.c2];
                chessBoard[move.r2][move.c2] = chessBoard[move.r1][move.c1]; chessBoard[move.r1][move.c1] = '';
                const score = minimax(depth - 1, false, -Infinity, Infinity);
                chessBoard[move.r1][move.c1] = chessBoard[move.r2][move.c2]; chessBoard[move.r2][move.c2] = t;
                if(score > bestScore) { bestScore = score; bestMove = move; }
            }
            return bestMove;
        }

        function minimax(depth, isMaximizing, alpha, beta) {
            if(depth === 0) return evaluateBoard();
            const moves = getAllMoves(isMaximizing ? 'black' : 'white');
            if(moves.length === 0) return isMaximizing ? -10000 : 10000;

            if(isMaximizing) {
                let maxEval = -Infinity;
                for(const move of moves) {
                    const t = chessBoard[move.r2][move.c2];
                    chessBoard[move.r2][move.c2] = chessBoard[move.r1][move.c1]; chessBoard[move.r1][move.c1] = '';
                    const eval = minimax(depth-1, false, alpha, beta);
                    chessBoard[move.r1][move.c1] = chessBoard[move.r2][move.c2]; chessBoard[move.r2][move.c2] = t;
                    maxEval = Math.max(maxEval, eval); alpha = Math.max(alpha, eval);
                    if(beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for(const move of moves) {
                    const t = chessBoard[move.r2][move.c2];
                    chessBoard[move.r2][move.c2] = chessBoard[move.r1][move.c1]; chessBoard[move.r1][move.c1] = '';
                    const eval = minimax(depth-1, true, alpha, beta);
                    chessBoard[move.r1][move.c1] = chessBoard[move.r2][move.c2]; chessBoard[move.r2][move.c2] = t;
                    minEval = Math.min(minEval, eval); beta = Math.min(beta, eval);
                    if(beta <= alpha) break;
                }
                return minEval;
            }
        }

        function evaluateBoard() {
            let score = 0;
            for(let r=0; r<8; r++) for(let c=0; c<8; c++) {
                const p = chessBoard[r][c];
                if(p) {
                    const val = pieceValues[p.toLowerCase()] || 0;
                    score += (p === p.toLowerCase()) ? val : -val;
                }
            }
            return score;
        }

        function getAllMoves(color) {
            const moves = [];
            for(let r=0; r<8; r++) for(let c=0; c<8; c++) {
                const p = chessBoard[r][c]; if(!p) continue;
                const isMine = (color === 'white') ? (p === p.toUpperCase()) : (p === p.toLowerCase());
                if(isMine) {
                    for(let tr=0; tr<8; tr++) for(let tc=0; tc<8; tc++) {
                        if(isMoveLegal(r, c, tr, tc)) moves.push({r1:r, c1:c, r2:tr, c2:tc});
                    }
                }
            }
            return moves;
        }

        function isMoveLegal(r1, c1, r2, c2) {
            if(!isValidGeom(r1, c1, r2, c2, chessBoard)) return false;
            const t = chessBoard[r2][c2]; const m = chessBoard[r1][c1];
            chessBoard[r2][c2] = m; chessBoard[r1][c1] = '';
            const safe = !isKingInCheck((m===m.toUpperCase())?'white':'black');
            chessBoard[r1][c1] = m; chessBoard[r2][c2] = t;
            return safe;
        }

        function isValidGeom(r1, c1, r2, c2, b) {
            const p = b[r1][c1].toLowerCase();
            const dx = Math.abs(c2-c1), dy = Math.abs(r2-r1);
            if(b[r2][c2]) { if((b[r1][c1]===b[r1][c1].toUpperCase()) === (b[r2][c2]===b[r2][c2].toUpperCase())) return false; }
            if(p==='p') {
                const isW = b[r1][c1]==='P';
                const dir = isW ? -1 : 1; const start = isW ? 6 : 1;
                if(c1===c2 && r2===r1+dir && !b[r2][c2]) return true;
                if(c1===c2 && r2===r1+dir*2 && r1===start && !b[r2][c2] && !b[r1+dir][c1]) return true;
                if(Math.abs(c1-c2)===1 && r2===r1+dir && b[r2][c2]) return true;
                return false;
            }
            if(p==='r') return (r1===r2||c1===c2) && clearPath(r1,c1,r2,c2,b);
            if(p==='b') return (dx===dy) && clearPath(r1,c1,r2,c2,b);
            if(p==='q') return (r1===r2||c1===c2||dx===dy) && clearPath(r1,c1,r2,c2,b);
            if(p==='n') return (dx===2&&dy===1)||(dx===1&&dy===2);
            if(p==='k') return dx<=1 && dy<=1;
            return false;
        }

        function clearPath(r1, c1, r2, c2, b) {
            const rd = Math.sign(r2-r1), cd = Math.sign(c2-c1);
            let r=r1+rd, c=c1+cd;
            while(r!==r2 || c!==c2) { if(b[r][c]) return false; r+=rd; c+=cd; }
            return true;
        }

        function isKingInCheck(color) {
            let kR, kC; const kChar = color==='white'?'K':'k';
            for(let r=0; r<8; r++) for(let c=0; c<8; c++) if(chessBoard[r][c]===kChar) {kR=r; kC=c;}
            if(kR===undefined) return true;
            for(let r=0; r<8; r++) for(let c=0; c<8; c++) {
                if(!chessBoard[r][c]) continue;
                const isEnemy = (color==='white') ? (chessBoard[r][c]===chessBoard[r][c].toLowerCase()) : (chessBoard[r][c]===chessBoard[r][c].toUpperCase());
                if(isEnemy && isValidGeom(r,c,kR,kC,chessBoard)) return true;
            }
            return false;
        }

        function hasValidMoves(color) {
            for(let r=0; r<8; r++) for(let c=0; c<8; c++) {
                const p = chessBoard[r][c]; if(!p) continue;
                const isMine = (color==='white') ? (p===p.toUpperCase()) : (p===p.toLowerCase());
                if(isMine) for(let tr=0; tr<8; tr++) for(let tc=0; tc<8; tc++) if (isMoveLegal(r,c,tr,tc)) return true;
            }
            return false;
        }

        // Initialize Overlay on Load
        window.onload = () => {
            showChessOverlay();
        };
    </script>
