<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timed Tic-Tac-Toe | NEON LAB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050b14;
            --cyan: #00eaff;
            --cyan-glow: rgba(0, 234, 255, 0.45);
            --red: #ff4466;
            --red-glow: rgba(255, 68, 102, 0.45);
            --gold: #ffd54a;
            --gold-glow: rgba(255, 213, 74, 0.6);
            --card-bg: rgba(7, 18, 34, 0.82);
            --glass-border: rgba(0, 234, 255, 0.35);
            --glass-blur: blur(20px);
            --transition-fast: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

        body {
            min-height: 100vh;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(0, 234, 255, 0.12) 0%, transparent 60%),
                linear-gradient(180deg, rgba(5, 11, 20, 0.88) 0%, rgba(5, 11, 20, 0.96) 100%),
                url('https://image2url.com/images/1763374021173-7883e334-bb59-434f-a32d-83e8604794f2.jpeg');
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Poppins', sans-serif;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            padding-bottom: 2.5rem;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0.18) 1.5px, transparent 1.5px, transparent 3px);
            pointer-events: none; z-index: 999; opacity: 0.85;
        }

        .top-navbar {
            width: 100%; height: 58px;
            background: rgba(5, 11, 20, 0.85);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1.5px solid var(--cyan);
            box-shadow: 0 4px 20px rgba(0, 234, 255, 0.2);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 1.5rem; position: sticky; top: 0; z-index: 100;
        }

        .nav-link {
            color: #a0aec0; text-decoration: none; font-size: 0.85rem; font-weight: 600;
            letter-spacing: 0.08em; text-transform: uppercase;
            display: inline-flex; align-items: center; gap: 0.4rem;
            transition: all var(--transition-fast);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 0.35rem 0.85rem; border-radius: 9999px;
        }
        .nav-link:hover { color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 12px var(--cyan-glow); transform: translateX(-2px); }
        .nav-title { font-size: 0.85rem; font-weight: 800; letter-spacing: 0.15em; color: var(--cyan); text-shadow: 0 0 10px var(--cyan-glow); }

        .main-container { width: 100%; max-width: 580px; padding: 1.25rem 1rem; display: flex; justify-content: center; z-index: 10; }

        @keyframes cardEntrance { 0% { opacity: 0; transform: translateY(35px) scale(0.96); filter: blur(12px); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }

        .glass-card {
            width: 100%; background: var(--card-bg);
            backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            border-radius: 28px; border: 1.5px solid var(--glass-border);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.65), 0 0 35px rgba(0, 234, 255, 0.18), inset 0 0 20px rgba(0, 234, 255, 0.05);
            padding: 1.8rem 1.6rem; display: flex; flex-direction: column; align-items: center; gap: 1.2rem;
            animation: cardEntrance 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .header-group { text-align: center; }
        .game-heading { font-size: 1.85rem; font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase; color: #ffffff; text-shadow: 0 0 12px var(--cyan), 0 0 30px var(--cyan-glow); line-height: 1.2; }
        .rules-hint { margin-top: 0.35rem; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.05em; color: #94a3b8; text-transform: uppercase; }
        .rules-highlight { color: var(--cyan); font-weight: 700; text-shadow: 0 0 8px var(--cyan-glow); }

        .controls-wrapper { width: 100%; display: flex; flex-direction: column; gap: 0.65rem; }
        .pill-group { display: flex; justify-content: center; gap: 0.45rem; flex-wrap: wrap; }
        .pill-btn {
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(0, 234, 255, 0.25); color: #cbd5e1;
            font-family: inherit; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
            padding: 0.42rem 0.95rem; border-radius: 9999px; cursor: pointer; transition: all var(--transition-fast); outline: none;
        }
        .pill-btn:hover:not(:disabled) { transform: scale(1.05); border-color: var(--cyan); color: #ffffff; box-shadow: 0 0 12px var(--cyan-glow); background: rgba(0, 234, 255, 0.1); }
        .pill-btn.active { background: var(--cyan); color: #050b14; border-color: var(--cyan); box-shadow: 0 0 16px var(--cyan); font-weight: 800; }
        .pill-btn.diff-hard.active { background: linear-gradient(135deg, #ff2d55, #c81e3a); border-color: var(--red); color: #ffffff; box-shadow: 0 0 18px var(--red); }
        .pill-btn.option-btn.active { background: var(--gold); border-color: var(--gold); color: #050b14; box-shadow: 0 0 16px var(--gold-glow); }

        .scoreboard { width: 100%; display: grid; grid-template-columns: 1fr 0.8fr 1fr; gap: 0.65rem; margin-top: 0.2rem; }
        .score-card {
            background: rgba(10, 22, 40, 0.6); border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px; padding: 0.75rem 0.5rem; text-align: center; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .score-card .player-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #94a3b8; }
        .score-card .score-num { font-size: 1.55rem; font-weight: 900; line-height: 1.2; margin-top: 0.15rem; color: #ffffff; }
        .score-card.player-x { border-color: rgba(0, 234, 255, 0.25); }
        .score-card.player-o { border-color: rgba(255, 68, 102, 0.25); }
        .score-card.active-turn-x { transform: scale(1.06); border-color: var(--cyan); box-shadow: 0 0 22px var(--cyan-glow), inset 0 0 12px rgba(0, 234, 255, 0.15); }
        .score-card.active-turn-x .player-label { color: var(--cyan); text-shadow: 0 0 8px var(--cyan-glow); }
        .score-card.active-turn-o { transform: scale(1.06); border-color: var(--red); box-shadow: 0 0 22px var(--red-glow), inset 0 0 12px rgba(255, 68, 102, 0.15); }
        .score-card.active-turn-o .player-label { color: var(--red); text-shadow: 0 0 8px var(--red-glow); }

        /* Neon Fuse Timer Styles */
        .timer-container {
            width: 100%;
            height: 18px;
            background: rgba(3, 8, 16, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 9px;
            position: relative;
            overflow: hidden;
            margin-bottom: 0.5rem;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .timer-bar {
            height: 100%;
            width: 100%;
            transform-origin: left;
            will-change: transform;
            transition: background-color var(--transition-fast), box-shadow var(--transition-fast);
        }
        .timer-bar.color-x {
            background: var(--cyan);
            box-shadow: 0 0 12px var(--cyan-glow);
        }
        .timer-bar.color-o {
            background: var(--red);
            box-shadow: 0 0 12px var(--red-glow);
        }
        .timer-bar.danger {
            animation: fusePulse 0.35s infinite alternate;
            background: #ffaa00 !important;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.8) !important;
        }
        @keyframes fusePulse {
            from { opacity: 1; filter: brightness(1.2); }
            to { opacity: 0.5; filter: brightness(0.7); }
        }
        .timer-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            color: #fff;
            text-shadow: 1px 1px 2px #000, 0 0 4px #000;
            z-index: 2;
            pointer-events: none;
        }

        .status-line { font-size: 0.95rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; min-height: 1.7rem; display: flex; align-items: center; justify-content: center; text-align: center; transition: color var(--transition-fast), text-shadow var(--transition-fast); }
        .status-x { color: var(--cyan); text-shadow: 0 0 12px var(--cyan-glow); }
        .status-o { color: var(--red); text-shadow: 0 0 12px var(--red-glow); }
        .status-gold { color: var(--gold); text-shadow: 0 0 16px var(--gold-glow); }

        .board-container {
            position: relative; width: 100%; max-width: 380px; aspect-ratio: 1 / 1; margin: 0 auto;
            background: rgba(3, 8, 16, 0.65); border-radius: 20px; border: 1px solid rgba(0, 234, 255, 0.2);
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.7); padding: 8px;
        }
        .board-grid { display: grid; width: 100%; height: 100%; gap: 8px; }
        .board-grid.size-3 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
        .board-grid.size-4 { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 6px; }
        .board-grid.size-5 { grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); gap: 4px; }

        .cell {
            background: rgba(14, 29, 51, 0.45); border: 1.5px solid rgba(0, 234, 255, 0.15); border-radius: 12px;
            display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative;
            transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease; touch-action: manipulation;
        }
        .board-grid.size-4 .cell, .board-grid.size-5 .cell { border-radius: 8px; }
        
        .board-container:not(.game-over) .cell:hover:empty { background: rgba(0, 234, 255, 0.08); border-color: rgba(0, 234, 255, 0.45); box-shadow: 0 0 10px rgba(0, 234, 255, 0.2); }
        
        /* Hover Ghost Previews */
        .board-container.hover-x:not(.game-over) .cell:hover:empty::after { content: ''; position: absolute; width: 60%; height: 60%; background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M 24 24 L 76 76" stroke="%2300eaff" stroke-width="14" stroke-linecap="round"/><path d="M 76 24 L 24 76" stroke="%2300eaff" stroke-width="14" stroke-linecap="round"/></svg>') center/contain no-repeat; opacity: 0.3; }
        .board-container.hover-o:not(.game-over) .cell:hover:empty::after { content: ''; position: absolute; width: 60%; height: 60%; background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="27" fill="none" stroke="%23ff4466" stroke-width="13" stroke-linecap="round"/></svg>') center/contain no-repeat; opacity: 0.3; }

        .cell.last-move { box-shadow: inset 0 0 14px rgba(0, 234, 255, 0.35); border-color: rgba(0, 234, 255, 0.7); }

        @keyframes winPulse { 0%, 100% { transform: scale(1); border-color: var(--gold); box-shadow: 0 0 20px var(--gold-glow), inset 0 0 12px rgba(255, 213, 74, 0.3); } 50% { transform: scale(1.05); border-color: #ffffff; box-shadow: 0 0 28px var(--gold), inset 0 0 18px rgba(255, 213, 74, 0.5); } }
        .cell.winning-cell { animation: winPulse 1.4s infinite ease-in-out; z-index: 5; background: rgba(255, 213, 74, 0.12) !important; }
        .board-container.has-winner .cell:not(.winning-cell) .mark-svg { opacity: 0.22; filter: grayscale(80%); transition: opacity 0.5s ease, filter 0.5s ease; }

        @keyframes shakeCell { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-5px) rotate(-1deg); } 40% { transform: translateX(5px) rotate(1deg); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
        .cell.shake { animation: shakeCell 0.32s ease-in-out; }

        .mark-svg { width: 70%; height: 70%; overflow: visible; pointer-events: none; }
        @keyframes drawStroke { to { stroke-dashoffset: 0; } }
        
        .mark-x { stroke: var(--cyan); filter: drop-shadow(0 0 8px var(--cyan-glow)) drop-shadow(0 0 16px rgba(0, 234, 255, 0.6)); }
        .mark-x path { stroke-dasharray: 1; stroke-dashoffset: 1; }
        .mark-x path.stroke-1 { animation: drawStroke 0.24s cubic-bezier(0.2, 0.8, 0.3, 1) forwards; }
        .mark-x path.stroke-2 { animation: drawStroke 0.24s cubic-bezier(0.2, 0.8, 0.3, 1) 0.18s forwards; }

        .mark-o { stroke: var(--red); filter: drop-shadow(0 0 8px var(--red-glow)) drop-shadow(0 0 16px rgba(255, 68, 102, 0.6)); }
        .mark-o circle { stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawStroke 0.38s cubic-bezier(0.2, 0.8, 0.3, 1) forwards; transform-origin: center; transform: rotate(-90deg); }

        .win-line-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .win-line-svg line {
            stroke: var(--gold); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1;
            filter: drop-shadow(0 0 10px var(--gold)) drop-shadow(0 0 20px var(--gold-glow));
            animation: drawStroke 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .actions-group { width: 100%; display: flex; flex-direction: column; gap: 0.65rem; align-items: center; margin-top: 0.4rem; }
        .btn-new-round {
            width: 100%; background: linear-gradient(135deg, rgba(0, 234, 255, 0.18), rgba(0, 234, 255, 0.05));
            border: 1.5px solid var(--cyan); color: #ffffff; font-family: inherit; font-size: 0.95rem; font-weight: 800;
            letter-spacing: 0.12em; text-transform: uppercase; padding: 0.82rem 1.2rem; border-radius: 9999px;
            cursor: pointer; box-shadow: 0 0 16px rgba(0, 234, 255, 0.2); transition: all var(--transition-fast); outline: none;
        }
        .btn-new-round:hover { background: var(--cyan); color: #050b14; box-shadow: 0 0 28px var(--cyan); transform: translateY(-2px); }
        .btn-new-round:active { transform: translateY(0); }

        .btn-reset-scores { background: transparent; border: 1px solid rgba(255, 255, 255, 0.2); color: #94a3b8; font-family: inherit; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.35rem 1rem; border-radius: 9999px; cursor: pointer; transition: all var(--transition-fast); outline: none; }
        .btn-reset-scores:hover { border-color: var(--red); color: var(--red); box-shadow: 0 0 10px var(--red-glow); }

        @media (max-width: 440px) {
            .glass-card { padding: 1.4rem 1.1rem; border-radius: 22px; }
            .game-heading { font-size: 1.45rem; }
            .pill-btn { font-size: 0.68rem; padding: 0.35rem 0.75rem; }
            .score-card .score-num { font-size: 1.3rem; }
            .board-container { max-width: 320px; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } .mark-x path, .mark-o circle, .win-line-svg line { stroke-dashoffset: 0 !important; } .timer-bar { transition: none !important; } }
    </style>
</head>
<body>

    <nav class="top-navbar">
        <a href="tictactoe-dashboard.html" class="nav-link"><span>&#8592;</span> Dashboard</a>
        <div class="nav-title">TIMED</div>
    </nav>

    <main class="main-container">
        <div class="glass-card">
            
            <div class="header-group">
                <h1 class="game-heading">Timed Tic-Tac-Toe</h1>
                <p class="rules-hint">Make your move before the <span class="rules-highlight">neon fuse</span> burns out!</p>
            </div>

            <div class="controls-wrapper">
                <div class="pill-group" id="modeGroup">
                    <button class="pill-btn active" data-mode="ai">vs AI</button>
                    <button class="pill-btn" data-mode="pvp">2 Players</button>
                </div>
                <div class="pill-group" id="diffGroup">
                    <button class="pill-btn" data-diff="easy">Easy</button>
                    <button class="pill-btn active" data-diff="medium">Medium</button>
                    <button class="pill-btn diff-hard" data-diff="hard">Hard</button>
                </div>
                <div class="pill-group" id="sizeGroup">
                    <button class="pill-btn option-btn active" data-size="3" data-streak="3">3×3</button>
                    <button class="pill-btn option-btn" data-size="4" data-streak="4">4×4</button>
                    <button class="pill-btn option-btn" data-size="5" data-streak="4">5×5</button>
                </div>
                <div class="pill-group" id="timeGroup">
                    <button class="pill-btn option-btn active" data-time-type="move" data-time-val="5">5s / Move</button>
                    <button class="pill-btn option-btn" data-time-type="move" data-time-val="10">10s / Move</button>
                    <button class="pill-btn option-btn" data-time-type="total" data-time-val="60">60s Total</button>
                </div>
            </div>

            <div class="scoreboard">
                <div class="score-card player-x active-turn-x" id="scoreCardX">
                    <div class="player-label" id="labelPlayerX">You (X)</div>
                    <div class="score-num" id="scoreX">0</div>
                </div>
                <div class="score-card" id="scoreCardDraw">
                    <div class="player-label">Draws</div>
                    <div class="score-num" id="scoreDraw">0</div>
                </div>
                <div class="score-card player-o" id="scoreCardO">
                    <div class="player-label" id="labelPlayerO">AI (O)</div>
                    <div class="score-num" id="scoreO">0</div>
                </div>
            </div>

            <div class="timer-container" id="timerContainer">
                <div class="timer-bar color-x" id="timerFill"></div>
                <div class="timer-text" id="timerText">05.0s</div>
            </div>

            <div class="status-line status-x" id="statusLine">YOUR TURN (X)</div>

            <div class="board-container hover-x" id="boardContainer">
                <div class="board-grid size-3" id="boardGrid">
                    <!-- Cells injected by JS -->
                </div>
                <svg class="win-line-svg" id="winLineSvg" viewBox="0 0 100 100" preserveAspectRatio="none" style="display: none;">
                    <line id="winSvgLine" x1="0" y1="0" x2="0" y2="0" pathLength="1" />
                </svg>
            </div>

            <div class="actions-group">
                <button class="btn-new-round" id="btnNewRound">New Round</button>
                <button class="btn-reset-scores" id="btnResetScores">Reset Scores</button>
            </div>
        </div>
    </main>

    <script>
        (function () {
            'use strict';

            const state = {
                mode: 'ai',
                difficulty: 'medium',
                size: 3,
                streak: 3,
                timeType: 'move',
                timeVal: 5,
                timeMax: 5000,
                timeLeft: 5000,
                playerTimes: { X: 5000, O: 5000 },
                board: [],
                currentPlayer: 'X',
                startingPlayer: 'X',
                gameOver: false,
                aiThinking: false,
                lastMoveIdx: null,
                scores: { X: 0, O: 0, draw: 0 },
                winLines: []
            };

            const dom = {
                modeBtns: document.querySelectorAll('#modeGroup .pill-btn'),
                diffBtns: document.querySelectorAll('#diffGroup .pill-btn'),
                sizeBtns: document.querySelectorAll('#sizeGroup .pill-btn'),
                timeBtns: document.querySelectorAll('#timeGroup .pill-btn'),
                diffGroup: document.getElementById('diffGroup'),
                labelPlayerX: document.getElementById('labelPlayerX'),
                labelPlayerO: document.getElementById('labelPlayerO'),
                scoreX: document.getElementById('scoreX'),
                scoreO: document.getElementById('scoreO'),
                scoreDraw: document.getElementById('scoreDraw'),
                scoreCardX: document.getElementById('scoreCardX'),
                scoreCardO: document.getElementById('scoreCardO'),
                statusLine: document.getElementById('statusLine'),
                timerFill: document.getElementById('timerFill'),
                timerText: document.getElementById('timerText'),
                boardContainer: document.getElementById('boardContainer'),
                boardGrid: document.getElementById('boardGrid'),
                winLineSvg: document.getElementById('winLineSvg'),
                winSvgLine: document.getElementById('winSvgLine'),
                btnNewRound: document.getElementById('btnNewRound'),
                btnResetScores: document.getElementById('btnResetScores')
            };

            let cellEls = [];
            let lastTime = 0;
            let rafId = null;

            function init() {
                generateWinLines();
                buildBoardDOM();
                attachEventListeners();
                updateUI();
                startRound(true);
            }

            // --- Timer Logic ---
            function startTimer() {
                lastTime = performance.now();
                if (rafId) cancelAnimationFrame(rafId);
                rafId = requestAnimationFrame(tickTimer);
            }

            function stopTimer() {
                if (rafId) cancelAnimationFrame(rafId);
                rafId = null;
            }

            function tickTimer(now) {
                if (state.gameOver) return;
                
                let dt = now - lastTime;
                // Cap dt to prevent massive jumps if tab is inactive
                if (dt > 1000) dt = 1000; 
                lastTime = now;

                if (state.timeType === 'move') {
                    state.timeLeft -= dt;
                } else {
                    state.playerTimes[state.currentPlayer] -= dt;
                    state.timeLeft = state.playerTimes[state.currentPlayer];
                }

                if (state.timeLeft <= 0) {
                    state.timeLeft = 0;
                    updateTimerUI();
                    handleTimeOut();
                    return;
                }

                updateTimerUI();
                rafId = requestAnimationFrame(tickTimer);
            }

            function updateTimerUI() {
                const scale = state.timeLeft / state.timeMax;
                dom.timerFill.style.transform = `scaleX(${Math.max(0, scale)})`;
                dom.timerText.textContent = Math.max(0, (state.timeLeft / 1000)).toFixed(1) + 's';

                if (state.currentPlayer === 'X') {
                    dom.timerFill.className = 'timer-bar color-x';
                } else {
                    dom.timerFill.className = 'timer-bar color-o';
                }

                // Danger zone: under 3 seconds or 25% of total
                if (state.timeLeft <= 3000 || scale <= 0.25) {
                    dom.timerFill.classList.add('danger');
                } else {
                    dom.timerFill.classList.remove('danger');
                }
            }

            function handleTimeOut() {
                stopTimer();
                const winner = state.currentPlayer === 'X' ? 'O' : 'X';
                handleGameEnd(winner, null, true);
            }
            // ------------------

            function generateWinLines() {
                state.winLines = [];
                const s = state.size;
                const k = state.streak;
                
                // Rows & Cols
                for (let r = 0; r < s; r++) {
                    for (let c = 0; c <= s - k; c++) {
                        const row = []; const col = [];
                        for (let i = 0; i < k; i++) {
                            row.push(r * s + (c + i));
                            col.push((c + i) * s + r);
                        }
                        state.winLines.push(row);
                        state.winLines.push(col);
                    }
                }
                
                // Diagonals
                for (let r = 0; r <= s - k; r++) {
                    for (let c = 0; c <= s - k; c++) {
                        const diag1 = []; const diag2 = [];
                        for (let i = 0; i < k; i++) {
                            diag1.push((r + i) * s + (c + i));
                            diag2.push((r + i) * s + (c + k - 1 - i));
                        }
                        state.winLines.push(diag1);
                        state.winLines.push(diag2);
                    }
                }
            }

            function buildBoardDOM() {
                dom.boardGrid.innerHTML = '';
                dom.boardGrid.className = `board-grid size-${state.size}`;
                state.board = Array(state.size * state.size).fill(null);
                cellEls = [];
                
                for (let i = 0; i < state.size * state.size; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.index = i;
                    cell.addEventListener('click', () => handleCellClick(i));
                    dom.boardGrid.appendChild(cell);
                    cellEls.push(cell);
                }
            }

            function createMarkSVG(type) {
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('viewBox', '0 0 100 100');
                svg.setAttribute('class', `mark-svg ${type === 'X' ? 'mark-x' : 'mark-o'}`);
                if (type === 'X') {
                    const p1 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    p1.setAttribute('d', 'M 24 24 L 76 76'); p1.setAttribute('stroke-width', '14'); p1.setAttribute('stroke-linecap', 'round'); p1.setAttribute('pathLength', '1'); p1.setAttribute('class', 'stroke-1');
                    const p2 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    p2.setAttribute('d', 'M 76 24 L 24 76'); p2.setAttribute('stroke-width', '14'); p2.setAttribute('stroke-linecap', 'round'); p2.setAttribute('pathLength', '1'); p2.setAttribute('class', 'stroke-2');
                    svg.appendChild(p1); svg.appendChild(p2);
                } else {
                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('cx', '50'); circle.setAttribute('cy', '50'); circle.setAttribute('r', '27');
                    circle.setAttribute('fill', 'none'); circle.setAttribute('stroke-width', '13'); circle.setAttribute('stroke-linecap', 'round'); circle.setAttribute('pathLength', '1');
                    svg.appendChild(circle);
                }
                return svg;
            }

            function handleCellClick(index) {
                if (state.gameOver || state.aiThinking || state.board[index] !== null) {
                    if (state.board[index] !== null && !state.gameOver) shakeCell(index);
                    return;
                }
                executeMove(index, state.currentPlayer);
            }

            function executeMove(index, player) {
                state.board[index] = player;
                state.lastMoveIdx = index;
                renderPlacement(index, player);

                const winResult = checkWin(state.board);
                if (winResult) {
                    handleGameEnd(winResult.winner, winResult.line);
                    return;
                } 
                
                if (state.board.every(c => c !== null)) {
                    handleGameEnd('D', null);
                    return;
                }

                // Switch turn and manage timers
                state.currentPlayer = player === 'X' ? 'O' : 'X';
                if (state.timeType === 'move') {
                    state.timeLeft = state.timeMax;
                } else {
                    state.timeLeft = state.playerTimes[state.currentPlayer];
                }

                updateUI();

                if (state.mode === 'ai' && state.currentPlayer === 'O' && !state.gameOver) {
                    state.aiThinking = true;
                    // If AI has less than 2 seconds, skip the artificial delay!
                    const aiDelay = state.timeLeft <= 2000 ? 100 : 600;
                    setTimeout(makeAIMove, aiDelay);
                }
            }

            function renderPlacement(index, player) {
                cellEls.forEach(c => c.classList.remove('last-move'));
                const cell = cellEls[index];
                cell.innerHTML = '';
                cell.appendChild(createMarkSVG(player));
                cell.classList.add('last-move');
            }

            function checkWin(boardState) {
                for (const line of state.winLines) {
                    const first = boardState[line[0]];
                    if (first !== null) {
                        let win = true;
                        for (let i = 1; i < state.streak; i++) {
                            if (boardState[line[i]] !== first) {
                                win = false; break;
                            }
                        }
                        if (win) return { winner: first, line: line };
                    }
                }
                return null;
            }

            function handleGameEnd(winner, line, isTimeout = false) {
                state.gameOver = true;
                stopTimer();
                dom.boardContainer.classList.add('game-over');
                
                if (winner !== 'D') {
                    state.scores[winner]++;
                    dom.boardContainer.classList.add('has-winner');
                    if (line) {
                        line.forEach(idx => cellEls[idx].classList.add('winning-cell'));
                        drawWinLine(line);
                    }
                } else {
                    state.scores.draw++;
                }
                updateUI(winner, isTimeout);
            }

            function drawWinLine(line) {
                dom.winLineSvg.style.display = 'block';
                const s = state.size;
                const getCoord = (idx) => {
                    const row = Math.floor(idx / s); const col = idx % s;
                    const cellPct = 100 / s;
                    return { x: (col * cellPct) + (cellPct / 2), y: (row * cellPct) + (cellPct / 2) };
                };
                const start = getCoord(line[0]); const end = getCoord(line[line.length - 1]);
                dom.winSvgLine.setAttribute('x1', `${start.x}%`); dom.winSvgLine.setAttribute('y1', `${start.y}%`);
                dom.winSvgLine.setAttribute('x2', `${end.x}%`); dom.winSvgLine.setAttribute('y2', `${end.y}%`);
            }

            function shakeCell(index) {
                const cell = cellEls[index];
                cell.classList.add('shake');
                setTimeout(() => cell.classList.remove('shake'), 320);
            }

            function updateUI(winnerCode = null, isTimeout = false) {
                dom.modeBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === state.mode));
                dom.diffBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.diff === state.difficulty));
                dom.sizeBtns.forEach(btn => btn.classList.toggle('active', parseInt(btn.dataset.size) === state.size));
                dom.timeBtns.forEach(btn => btn.classList.toggle('active', 
                    btn.dataset.timeType === state.timeType && parseInt(btn.dataset.timeVal) === state.timeVal
                ));
                dom.diffGroup.style.display = state.mode === 'ai' ? 'flex' : 'none';

                dom.labelPlayerX.textContent = state.mode === 'ai' ? 'Human (X)' : 'Player 1 (X)';
                dom.labelPlayerO.textContent = state.mode === 'ai' ? 'AI (O)' : 'Player 2 (O)';
                dom.scoreX.textContent = state.scores.X;
                dom.scoreO.textContent = state.scores.O;
                dom.scoreDraw.textContent = state.scores.draw;

                dom.scoreCardX.classList.remove('active-turn-x');
                dom.scoreCardO.classList.remove('active-turn-o');
                dom.boardContainer.classList.remove('hover-x', 'hover-o');
                
                if (!state.gameOver) {
                    dom.boardContainer.classList.add(state.currentPlayer === 'X' ? 'hover-x' : 'hover-o');
                    if (state.currentPlayer === 'X') dom.scoreCardX.classList.add('active-turn-x');
                    else dom.scoreCardO.classList.add('active-turn-o');
                }

                dom.statusLine.className = 'status-line';
                if (state.gameOver) {
                    if (winnerCode && winnerCode !== 'D') {
                        const winnerName = winnerCode === 'X' ? dom.labelPlayerX.textContent : dom.labelPlayerO.textContent;
                        const loserName = winnerCode === 'X' ? dom.labelPlayerO.textContent : dom.labelPlayerX.textContent;
                        
                        if (isTimeout) {
                            dom.statusLine.textContent = `${loserName.toUpperCase()} RAN OUT OF TIME! ${winnerName.toUpperCase()} WINS!`;
                        } else {
                            dom.statusLine.textContent = `${winnerName.toUpperCase()} WINS!`;
                        }
                        dom.statusLine.classList.add(`status-${winnerCode.toLowerCase()}`);
                    } else {
                        dom.statusLine.textContent = 'MATCH DRAWN!';
                        dom.statusLine.classList.add('status-gold');
                    }
                } else {
                    const curName = state.currentPlayer === 'X' ? dom.labelPlayerX.textContent : dom.labelPlayerO.textContent;
                    dom.statusLine.textContent = `${curName.toUpperCase()}'S TURN`;
                    dom.statusLine.classList.add(`status-${state.currentPlayer.toLowerCase()}`);
                }
            }

            function startRound(forceReset = false) {
                if (forceReset) state.startingPlayer = 'X';
                else state.startingPlayer = state.startingPlayer === 'X' ? 'O' : 'X';

                state.currentPlayer = state.startingPlayer;
                state.gameOver = false;
                state.aiThinking = false;
                state.board.fill(null);
                state.lastMoveIdx = null;

                // Setup Clocks
                state.timeMax = state.timeVal * 1000;
                if (state.timeType === 'move') {
                    state.timeLeft = state.timeMax;
                } else {
                    state.playerTimes = { X: state.timeMax, O: state.timeMax };
                    state.timeLeft = state.playerTimes[state.currentPlayer];
                }

                dom.winLineSvg.style.display = 'none';
                dom.boardContainer.classList.remove('has-winner', 'game-over');
                
                cellEls.forEach(cell => {
                    cell.innerHTML = '';
                    cell.className = 'cell';
                });

                updateUI();
                updateTimerUI(); // Initial draw before rAF starts
                startTimer();

                if (state.mode === 'ai' && state.currentPlayer === 'O') {
                    state.aiThinking = true;
                    setTimeout(makeAIMove, 600);
                }
            }

            function attachEventListeners() {
                dom.modeBtns.forEach(btn => btn.addEventListener('click', (e) => {
                    if (state.mode === e.target.dataset.mode) return;
                    state.mode = e.target.dataset.mode;
                    state.scores = { X: 0, O: 0, draw: 0 };
                    startRound(true);
                }));

                dom.diffBtns.forEach(btn => btn.addEventListener('click', (e) => {
                    if (state.difficulty === e.target.dataset.diff) return;
                    state.difficulty = e.target.dataset.diff;
                    state.scores = { X: 0, O: 0, draw: 0 };
                    startRound(true);
                }));

                dom.sizeBtns.forEach(btn => btn.addEventListener('click', (e) => {
                    const newSize = parseInt(e.target.dataset.size);
                    if (state.size === newSize) return;
                    state.size = newSize;
                    state.streak = parseInt(e.target.dataset.streak);
                    state.scores = { X: 0, O: 0, draw: 0 };
                    generateWinLines();
                    buildBoardDOM();
                    startRound(true);
                }));

                dom.timeBtns.forEach(btn => btn.addEventListener('click', (e) => {
                    state.timeType = e.target.dataset.timeType;
                    state.timeVal = parseInt(e.target.dataset.timeVal);
                    state.scores = { X: 0, O: 0, draw: 0 };
                    startRound(true);
                }));

                dom.btnNewRound.addEventListener('click', () => startRound(false));
                dom.btnResetScores.addEventListener('click', () => {
                    state.scores = { X: 0, O: 0, draw: 0 };
                    updateUI();
                });
            }

            function getLegalMoves(b) {
                const moves = [];
                for (let i = 0; i < b.length; i++) if (b[i] === null) moves.push(i);
                return moves;
            }

            function evaluateHeuristic(b) {
                let score = 0;
                for (const line of state.winLines) {
                    let xCount = 0, oCount = 0;
                    for (const idx of line) {
                        if (b[idx] === 'X') xCount++;
                        else if (b[idx] === 'O') oCount++;
                    }
                    if (xCount > 0 && oCount > 0) continue; // Blocked line
                    
                    if (oCount > 0) score += Math.pow(10, oCount);
                    if (xCount > 0) score -= Math.pow(10, xCount);
                }
                const centerIdx = Math.floor((state.size * state.size) / 2);
                if (b[centerIdx] === 'O') score += 5;
                else if (b[centerIdx] === 'X') score -= 5;
                return score;
            }

            function minimax(b, depth, alpha, beta, isMax) {
                const winResult = checkWin(b);
                if (winResult) {
                    if (winResult.winner === 'O') return 10000 + depth;
                    if (winResult.winner === 'X') return -10000 - depth;
                }
                
                const moves = getLegalMoves(b);
                if (moves.length === 0) return 0; // Draw
                if (depth === 0) return evaluateHeuristic(b);

                if (isMax) {
                    let maxEval = -Infinity;
                    for (let m of moves) {
                        b[m] = 'O';
                        const ev = minimax(b, depth - 1, alpha, beta, false);
                        b[m] = null;
                        maxEval = Math.max(maxEval, ev);
                        alpha = Math.max(alpha, ev);
                        if (beta <= alpha) break;
                    }
                    return maxEval;
                } else {
                    let minEval = Infinity;
                    for (let m of moves) {
                        b[m] = 'X';
                        const ev = minimax(b, depth - 1, alpha, beta, true);
                        b[m] = null;
                        minEval = Math.min(minEval, ev);
                        beta = Math.min(beta, ev);
                        if (beta <= alpha) break;
                    }
                    return minEval;
                }
            }

            function makeAIMove() {
                if (state.gameOver) return; // Prevent moving if timed out
                const moves = getLegalMoves(state.board);
                if (moves.length === 0) return;

                let bestMove = moves[Math.floor(Math.random() * moves.length)];

                if (state.difficulty === 'easy') {
                    // Fully random
                } else if (state.difficulty === 'medium') {
                    // Look 1 step ahead for win/block
                    let instantWin = null, blockMove = null;
                    for (let m of moves) {
                        state.board[m] = 'O';
                        if (checkWin(state.board)) instantWin = m;
                        state.board[m] = null;
                        
                        state.board[m] = 'X';
                        if (checkWin(state.board)) blockMove = m;
                        state.board[m] = null;
                    }
                    if (instantWin !== null) bestMove = instantWin;
                    else if (blockMove !== null) bestMove = blockMove;
                } else {
                    let depthLimit = state.size === 3 ? 9 : (state.size === 4 ? 5 : 4);
                    
                    // Panic mode: if time is extremely short, cut search depth drastically
                    if (state.timeType === 'total' && state.playerTimes.O < 2000) {
                        depthLimit = state.size === 3 ? 3 : 2;
                    }

                    let bestScore = -Infinity;
                    let picks = [];
                    
                    // Quick opening center grab
                    if (moves.length === state.size * state.size) {
                        const center = Math.floor((state.size * state.size) / 2);
                        bestMove = center;
                    } else {
                        for (let m of moves) {
                            state.board[m] = 'O';
                            const score = minimax(state.board, depthLimit - 1, -Infinity, Infinity, false);
                            state.board[m] = null;
                            
                            if (score > bestScore) {
                                bestScore = score; picks = [m];
                            } else if (score === bestScore) {
                                picks.push(m);
                            }
                        }
                        bestMove = picks[Math.floor(Math.random() * picks.length)];
                    }
                }

                state.aiThinking = false;
                executeMove(bestMove, 'O');
            }

            init();
        })();
    </script>
