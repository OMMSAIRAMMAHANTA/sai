<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Four-Player Tic-Tac-Toe | NEON LAB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #050b14;
      --cyan: #00eaff;
      --cyan-glow: rgba(0, 234, 255, 0.45);
      --red: #ff4466;
      --red-glow: rgba(255, 68, 102, 0.45);
      --gold: #ffd54a;
      --gold-glow: rgba(255, 213, 74, 0.6);
      --purple: #b026ff;
      --purple-glow: rgba(176, 38, 255, 0.45);
      --card-bg: rgba(7, 18, 34, 0.82);
      --glass-border: rgba(0, 234, 255, 0.35);
      --glass-blur: blur(20px);
      --transition-fast: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

    body {
      min-height: 100vh;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(0, 234, 255, 0.12) 0%, transparent 60%),
        linear-gradient(180deg, rgba(5, 11, 20, 0.88) 0%, rgba(5, 11, 20, 0.96) 100%),
        url('https://image2url.com/images/1763374021173-7883e334-bb59-434f-a32d-83e8604794f2.jpeg');
      background-position: center; background-size: cover; background-repeat: no-repeat;
      background-attachment: fixed; font-family: 'Poppins', sans-serif; color: #e2e8f0;
      display: flex; flex-direction: column; align-items: center; position: relative;
      overflow-x: hidden; padding-bottom: 2.5rem;
    }

    body::before {
      content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0.18) 1.5px, transparent 1.5px, transparent 3px);
      pointer-events: none; z-index: 999; opacity: 0.85;
    }

    .top-navbar {
      width: 100%; height: 58px; background: rgba(5, 11, 20, 0.85);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1.5px solid var(--cyan); box-shadow: 0 4px 20px rgba(0, 234, 255, 0.2);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.5rem; position: sticky; top: 0; z-index: 100;
    }

    .nav-link {
      color: #a0aec0; text-decoration: none; font-size: 0.85rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 0.4rem;
      transition: all var(--transition-fast); border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0.35rem 0.85rem; border-radius: 9999px;
    }
    .nav-link:hover { color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 12px var(--cyan-glow); transform: translateX(-2px); }
    .nav-title { font-size: 0.85rem; font-weight: 800; letter-spacing: 0.15em; color: var(--cyan); text-shadow: 0 0 10px var(--cyan-glow); }

    .main-container { width: 100%; max-width: 580px; padding: 1.25rem 1rem; display: flex; justify-content: center; z-index: 10; }

    @keyframes cardEntrance { 0% { opacity: 0; transform: translateY(35px) scale(0.96); filter: blur(12px); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }

    .glass-card {
      width: 100%; background: var(--card-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border-radius: 28px; border: 1.5px solid var(--glass-border);
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.65), 0 0 35px rgba(0, 234, 255, 0.18), inset 0 0 20px rgba(0, 234, 255, 0.05);
      padding: 1.8rem 1.6rem; display: flex; flex-direction: column; align-items: center; gap: 1.2rem;
      animation: cardEntrance 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .header-group { text-align: center; }
    .game-heading { font-size: 1.85rem; font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase; color: #ffffff; text-shadow: 0 0 12px var(--cyan), 0 0 30px var(--cyan-glow); line-height: 1.2; }
    .rules-hint { margin-top: 0.35rem; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.05em; color: #94a3b8; text-transform: uppercase; }
    .rules-highlight { color: var(--cyan); font-weight: 700; text-shadow: 0 0 8px var(--cyan-glow); }

    .controls-wrapper { width: 100%; display: flex; flex-direction: column; gap: 0.65rem; }
    .pill-group { display: flex; justify-content: center; gap: 0.45rem; flex-wrap: wrap; }
    .pill-btn {
      background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(0, 234, 255, 0.25); color: #cbd5e1;
      font-family: inherit; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
      padding: 0.42rem 0.95rem; border-radius: 9999px; cursor: pointer; transition: all var(--transition-fast); outline: none;
    }
    .pill-btn:hover:not(:disabled) { transform: scale(1.05); border-color: var(--cyan); color: #ffffff; box-shadow: 0 0 12px var(--cyan-glow); background: rgba(0, 234, 255, 0.1); }
    .pill-btn.active { background: var(--cyan); color: #050b14; border-color: var(--cyan); box-shadow: 0 0 16px var(--cyan); font-weight: 800; }
    .pill-btn.diff-hard.active { background: linear-gradient(135deg, #ff2d55, #c81e3a); border-color: var(--red); color: #ffffff; box-shadow: 0 0 18px var(--red); }
    .pill-btn.option-btn.active { background: var(--gold); border-color: var(--gold); color: #050b14; box-shadow: 0 0 16px var(--gold-glow); }

    .scoreboard { width: 100%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.65rem; margin-top: 0.2rem; }
    .score-card {
      background: rgba(10, 22, 40, 0.6); border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px; padding: 0.5rem; text-align: center; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .score-card .player-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #94a3b8; }
    .score-card .score-num { font-size: 1.3rem; font-weight: 900; line-height: 1.2; margin-top: 0.1rem; color: #ffffff; }
    
    .score-card.player-0 { border-color: rgba(0, 234, 255, 0.25); }
    .score-card.player-1 { border-color: rgba(255, 68, 102, 0.25); }
    .score-card.player-2 { border-color: rgba(255, 213, 74, 0.25); }
    .score-card.player-3 { border-color: rgba(176, 38, 255, 0.25); }
    .score-draw { grid-column: span 2; display: flex; justify-content: center; align-items: center; gap: 10px; padding: 0.4rem; }
    .score-draw .score-num { margin-top: 0; font-size: 1.1rem; }

    .score-card.active-turn-0 { transform: scale(1.04); border-color: var(--cyan); box-shadow: 0 0 20px var(--cyan-glow), inset 0 0 10px rgba(0, 234, 255, 0.15); z-index: 2; }
    .score-card.active-turn-0 .player-label { color: var(--cyan); text-shadow: 0 0 8px var(--cyan-glow); }
    
    .score-card.active-turn-1 { transform: scale(1.04); border-color: var(--red); box-shadow: 0 0 20px var(--red-glow), inset 0 0 10px rgba(255, 68, 102, 0.15); z-index: 2; }
    .score-card.active-turn-1 .player-label { color: var(--red); text-shadow: 0 0 8px var(--red-glow); }

    .score-card.active-turn-2 { transform: scale(1.04); border-color: var(--gold); box-shadow: 0 0 20px var(--gold-glow), inset 0 0 10px rgba(255, 213, 74, 0.15); z-index: 2; }
    .score-card.active-turn-2 .player-label { color: var(--gold); text-shadow: 0 0 8px var(--gold-glow); }

    .score-card.active-turn-3 { transform: scale(1.04); border-color: var(--purple); box-shadow: 0 0 20px var(--purple-glow), inset 0 0 10px rgba(176, 38, 255, 0.15); z-index: 2; }
    .score-card.active-turn-3 .player-label { color: var(--purple); text-shadow: 0 0 8px var(--purple-glow); }

    .status-line { font-size: 0.95rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; min-height: 1.7rem; display: flex; align-items: center; justify-content: center; text-align: center; transition: color var(--transition-fast), text-shadow var(--transition-fast); margin: 0.4rem 0; }
    .status-0 { color: var(--cyan); text-shadow: 0 0 12px var(--cyan-glow); }
    .status-1 { color: var(--red); text-shadow: 0 0 12px var(--red-glow); }
    .status-2 { color: var(--gold); text-shadow: 0 0 12px var(--gold-glow); }
    .status-3 { color: var(--purple); text-shadow: 0 0 12px var(--purple-glow); }

    .board-container {
      position: relative; width: 100%; max-width: 420px; aspect-ratio: 1 / 1; margin: 0 auto;
      background: rgba(3, 8, 16, 0.65); border-radius: 20px; border: 1px solid rgba(0, 234, 255, 0.2);
      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.7); padding: 8px;
    }
    
    .board-grid { display: grid; width: 100%; height: 100%; gap: 6px; }
    .board-grid.size-5 { grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); gap: 5px; }
    .board-grid.size-6 { grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr); gap: 4px; }
    .board-grid.size-7 { grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(7, 1fr); gap: 3px; }

    .cell {
      background: rgba(14, 29, 51, 0.45); border: 1.5px solid rgba(0, 234, 255, 0.15); border-radius: 8px;
      display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative;
      transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease; touch-action: manipulation;
    }
    .board-grid.size-7 .cell { border-radius: 6px; border-width: 1px; }

    .board-container:not(.game-over) .cell:hover:empty { background: rgba(0, 234, 255, 0.08); border-color: rgba(0, 234, 255, 0.45); box-shadow: 0 0 10px rgba(0, 234, 255, 0.2); }
    
    .cell.last-move { box-shadow: inset 0 0 14px rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.4); }

    @keyframes winPulse { 0%, 100% { border-color: #ffffff; box-shadow: 0 0 20px rgba(255,255,255,0.4), inset 0 0 12px rgba(255,255,255,0.3); } 50% { border-color: currentColor; box-shadow: 0 0 28px currentColor, inset 0 0 18px currentColor; } }
    .cell.winning-cell { animation: winPulse 1.4s infinite ease-in-out; z-index: 5; background: rgba(255, 255, 255, 0.1) !important; }
    
    /* Dynamically assign pulse color based on winning player */
    .cell.winning-cell.win-0 { color: var(--cyan); }
    .cell.winning-cell.win-1 { color: var(--red); }
    .cell.winning-cell.win-2 { color: var(--gold); }
    .cell.winning-cell.win-3 { color: var(--purple); }

    .board-container.has-winner .cell:not(.winning-cell) .mark-svg { opacity: 0.22; filter: grayscale(80%); transition: opacity 0.5s ease, filter 0.5s ease; }

    @keyframes shakeCell { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-3px) rotate(-1deg); } 40% { transform: translateX(3px) rotate(1deg); } 60% { transform: translateX(-2px); } 80% { transform: translateX(2px); } }
    .cell.shake { animation: shakeCell 0.32s ease-in-out; }

    .mark-svg { width: 75%; height: 75%; overflow: visible; pointer-events: none; }
    @keyframes drawStroke { to { stroke-dashoffset: 0; } }
    
    /* 0: X (Cyan) */
    .mark-0 { stroke: var(--cyan); filter: drop-shadow(0 0 6px var(--cyan-glow)); }
    .mark-0 path { stroke-dasharray: 1; stroke-dashoffset: 1; }
    .mark-0 path.stroke-1 { animation: drawStroke 0.24s cubic-bezier(0.2, 0.8, 0.3, 1) forwards; }
    .mark-0 path.stroke-2 { animation: drawStroke 0.24s cubic-bezier(0.2, 0.8, 0.3, 1) 0.15s forwards; }

    /* 1: O (Red) */
    .mark-1 { stroke: var(--red); filter: drop-shadow(0 0 6px var(--red-glow)); }
    .mark-1 circle { stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawStroke 0.35s cubic-bezier(0.2, 0.8, 0.3, 1) forwards; transform-origin: center; transform: rotate(-90deg); }

    /* 2: Triangle (Gold) */
    .mark-2 { stroke: var(--gold); filter: drop-shadow(0 0 6px var(--gold-glow)); }
    .mark-2 polygon { stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawStroke 0.35s cubic-bezier(0.2, 0.8, 0.3, 1) forwards; }

    /* 3: Square (Purple) */
    .mark-3 { stroke: var(--purple); filter: drop-shadow(0 0 6px var(--purple-glow)); }
    .mark-3 rect { stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawStroke 0.35s cubic-bezier(0.2, 0.8, 0.3, 1) forwards; }

    .win-line-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    .win-line-svg line {
      stroke-width: 6; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1;
      animation: drawStroke 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    .actions-group { width: 100%; display: flex; flex-direction: column; gap: 0.65rem; align-items: center; margin-top: 0.8rem; }
    .btn-new-round {
      width: 100%; background: linear-gradient(135deg, rgba(0, 234, 255, 0.18), rgba(0, 234, 255, 0.05));
      border: 1.5px solid var(--cyan); color: #ffffff; font-family: inherit; font-size: 0.95rem; font-weight: 800;
      letter-spacing: 0.12em; text-transform: uppercase; padding: 0.82rem 1.2rem; border-radius: 9999px;
      cursor: pointer; box-shadow: 0 0 16px rgba(0, 234, 255, 0.2); transition: all var(--transition-fast); outline: none;
    }
    .btn-new-round:hover { background: var(--cyan); color: #050b14; box-shadow: 0 0 28px var(--cyan); transform: translateY(-2px); }
    .btn-new-round:active { transform: translateY(0); }

    .btn-reset-scores { background: transparent; border: 1px solid rgba(255, 255, 255, 0.2); color: #94a3b8; font-family: inherit; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.35rem 1rem; border-radius: 9999px; cursor: pointer; transition: all var(--transition-fast); outline: none; }
    .btn-reset-scores:hover { border-color: var(--red); color: var(--red); box-shadow: 0 0 10px var(--red-glow); }

    @media (max-width: 440px) {
      .glass-card { padding: 1.4rem 1.1rem; border-radius: 22px; }
      .game-heading { font-size: 1.35rem; }
      .pill-btn { font-size: 0.68rem; padding: 0.35rem 0.65rem; }
      .score-card { padding: 0.4rem; }
      .score-card .score-num { font-size: 1.1rem; }
    }
    @media (prefers-reduced-motion: reduce) { 
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } 
      .mark-0 path, .mark-1 circle, .mark-2 polygon, .mark-3 rect, .win-line-svg line { stroke-dashoffset: 0 !important; } 
    }
  </style>
</head>
<body>

  <nav class="top-navbar">
    <a href="tictactoe-dashboard.html" class="nav-link"><span>&#8592;</span> Dashboard</a>
    <div class="nav-title">FOUR-PLAYER</div>
  </nav>

  <main class="main-container">
    <div class="glass-card">
      
      <div class="header-group">
        <h1 class="game-heading">Four-Player Tic-Tac-Toe</h1>
        <p class="rules-hint">4 players. Connect <span class="rules-highlight">4 in a row</span> to win!</p>
      </div>

      <div class="controls-wrapper">
        <div class="pill-group" id="modeGroup">
          <button class="pill-btn active" data-mode="ai">1 vs 3 AI</button>
          <button class="pill-btn" data-mode="pvp">4 Players (Local)</button>
        </div>
        <div class="pill-group" id="diffGroup">
          <button class="pill-btn" data-diff="easy">Easy</button>
          <button class="pill-btn active" data-diff="medium">Medium</button>
          <button class="pill-btn diff-hard" data-diff="hard">Hard</button>
        </div>
        <div class="pill-group" id="sizeGroup">
          <button class="pill-btn option-btn active" data-size="5">5×5</button>
          <button class="pill-btn option-btn" data-size="6">6×6</button>
          <button class="pill-btn option-btn" data-size="7">7×7</button>
        </div>
      </div>

      <div class="scoreboard">
        <div class="score-card player-0 active-turn-0" id="scoreCard0">
          <div class="player-label" id="labelP0">P1 (X)</div>
          <div class="score-num" id="score0">0</div>
        </div>
        <div class="score-card player-1" id="scoreCard1">
          <div class="player-label" id="labelP1">AI 1 (O)</div>
          <div class="score-num" id="score1">0</div>
        </div>
        <div class="score-card player-2" id="scoreCard2">
          <div class="player-label" id="labelP2">AI 2 (△)</div>
          <div class="score-num" id="score2">0</div>
        </div>
        <div class="score-card player-3" id="scoreCard3">
          <div class="player-label" id="labelP3">AI 3 (◻)</div>
          <div class="score-num" id="score3">0</div>
        </div>
        <div class="score-card score-draw" id="scoreCardDraw">
          <div class="player-label">Draws</div>
          <div class="score-num" id="scoreDraw">0</div>
        </div>
      </div>

      <div class="status-line status-0" id="statusLine">PLAYER 1'S TURN</div>

      <div class="board-container" id="boardContainer">
        <div class="board-grid size-5" id="boardGrid">
          <!-- Cells injected by JS -->
        </div>
        <svg class="win-line-svg" id="winLineSvg" viewBox="0 0 100 100" preserveAspectRatio="none" style="display: none;">
          <line id="winSvgLine" x1="0" y1="0" x2="0" y2="0" pathLength="1" />
        </svg>
      </div>

      <div class="actions-group">
        <button class="btn-new-round" id="btnNewRound">New Round</button>
        <button class="btn-reset-scores" id="btnResetScores">Reset Scores</button>
      </div>
    </div>
  </main>

  <script>
    (function () {
      'use strict';

      // 4 Players: 0, 1, 2, 3
      const COLORS = ['#00eaff', '#ff4466', '#ffd54a', '#b026ff'];
      const PLAYER_NAMES = {
        ai: ['You (X)', 'AI 1 (O)', 'AI 2 (△)', 'AI 3 (◻)'],
        pvp: ['P1 (X)', 'P2 (O)', 'P3 (△)', 'P4 (◻)']
      };

      const state = {
        mode: 'ai',
        difficulty: 'medium',
        size: 5,
        streak: 4, // Always 4 to win for 4 players to make it possible but challenging
        board: [],
        currentPlayer: 0,
        startingPlayer: 0,
        gameOver: false,
        aiThinking: false,
        lastMoveIdx: null,
        scores: [0, 0, 0, 0, 0], // Index 4 is draws
        winLines: []
      };

      const dom = {
        modeBtns: document.querySelectorAll('#modeGroup .pill-btn'),
        diffBtns: document.querySelectorAll('#diffGroup .pill-btn'),
        sizeBtns: document.querySelectorAll('#sizeGroup .pill-btn'),
        diffGroup: document.getElementById('diffGroup'),
        labels: [
          document.getElementById('labelP0'), document.getElementById('labelP1'),
          document.getElementById('labelP2'), document.getElementById('labelP3')
        ],
        scoreEls: [
          document.getElementById('score0'), document.getElementById('score1'),
          document.getElementById('score2'), document.getElementById('score3'),
          document.getElementById('scoreDraw')
        ],
        scoreCards: [
          document.getElementById('scoreCard0'), document.getElementById('scoreCard1'),
          document.getElementById('scoreCard2'), document.getElementById('scoreCard3')
        ],
        statusLine: document.getElementById('statusLine'),
        boardContainer: document.getElementById('boardContainer'),
        boardGrid: document.getElementById('boardGrid'),
        winLineSvg: document.getElementById('winLineSvg'),
        winSvgLine: document.getElementById('winSvgLine'),
        btnNewRound: document.getElementById('btnNewRound'),
        btnResetScores: document.getElementById('btnResetScores')
      };

      let cellEls = [];

      function init() {
        generateWinLines();
        buildBoardDOM();
        attachEventListeners();
        updateUI();
        startRound(true);
      }

      function generateWinLines() {
        state.winLines = [];
        const s = state.size;
        const k = state.streak;
        
        for (let r = 0; r < s; r++) {
          for (let c = 0; c <= s - k; c++) {
            const row = []; const col = [];
            for (let i = 0; i < k; i++) {
              row.push(r * s + (c + i));
              col.push((c + i) * s + r);
            }
            state.winLines.push(row);
            state.winLines.push(col);
          }
        }
        for (let r = 0; r <= s - k; r++) {
          for (let c = 0; c <= s - k; c++) {
            const diag1 = []; const diag2 = [];
            for (let i = 0; i < k; i++) {
              diag1.push((r + i) * s + (c + i));
              diag2.push((r + i) * s + (c + k - 1 - i));
            }
            state.winLines.push(diag1);
            state.winLines.push(diag2);
          }
        }
      }

      function buildBoardDOM() {
        dom.boardGrid.innerHTML = '';
        dom.boardGrid.className = `board-grid size-${state.size}`;
        state.board = Array(state.size * state.size).fill(null);
        cellEls = [];
        
        for (let i = 0; i < state.size * state.size; i++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.index = i;
          cell.addEventListener('click', () => handleCellClick(i));
          dom.boardGrid.appendChild(cell);
          cellEls.push(cell);
        }
      }

      function createMarkSVG(playerIdx) {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 100 100');
        svg.setAttribute('class', `mark-svg mark-${playerIdx}`);
        
        const strokeW = state.size >= 6 ? '12' : '14'; // Slightly thinner for larger boards

        if (playerIdx === 0) { // X
          const p1 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          p1.setAttribute('d', 'M 22 22 L 78 78'); p1.setAttribute('stroke-width', strokeW); p1.setAttribute('stroke-linecap', 'round'); p1.setAttribute('pathLength', '1'); p1.setAttribute('class', 'stroke-1');
          const p2 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          p2.setAttribute('d', 'M 78 22 L 22 78'); p2.setAttribute('stroke-width', strokeW); p2.setAttribute('stroke-linecap', 'round'); p2.setAttribute('pathLength', '1'); p2.setAttribute('class', 'stroke-2');
          svg.appendChild(p1); svg.appendChild(p2);
        } else if (playerIdx === 1) { // O
          const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('cx', '50'); circle.setAttribute('cy', '50'); circle.setAttribute('r', '30');
          circle.setAttribute('fill', 'none'); circle.setAttribute('stroke-width', strokeW); circle.setAttribute('stroke-linecap', 'round'); circle.setAttribute('pathLength', '1');
          svg.appendChild(circle);
        } else if (playerIdx === 2) { // Triangle
          const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          poly.setAttribute('points', '50,18 84,80 16,80');
          poly.setAttribute('fill', 'none'); poly.setAttribute('stroke-width', strokeW); poly.setAttribute('stroke-linejoin', 'round'); poly.setAttribute('pathLength', '1');
          svg.appendChild(poly);
        } else if (playerIdx === 3) { // Square
          const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          rect.setAttribute('x', '22'); rect.setAttribute('y', '22'); rect.setAttribute('width', '56'); rect.setAttribute('height', '56');
          rect.setAttribute('fill', 'none'); rect.setAttribute('stroke-width', strokeW); rect.setAttribute('stroke-linejoin', 'round'); rect.setAttribute('pathLength', '1');
          svg.appendChild(rect);
        }
        return svg;
      }

      function handleCellClick(index) {
        if (state.gameOver || state.aiThinking || state.board[index] !== null) {
          if (state.board[index] !== null && !state.gameOver) shakeCell(index);
          return;
        }
        executeMove(index, state.currentPlayer);
      }

      function executeMove(index, playerIdx) {
        state.board[index] = playerIdx;
        state.lastMoveIdx = index;
        
        cellEls.forEach(c => c.classList.remove('last-move'));
        const cell = cellEls[index];
        cell.innerHTML = '';
        cell.appendChild(createMarkSVG(playerIdx));
        cell.classList.add('last-move');

        const winResult = checkWin(state.board);
        if (winResult) {
          handleGameEnd(winResult.winner, winResult.line);
          return;
        } 
        
        if (state.board.every(c => c !== null)) {
          handleGameEnd('D', null);
          return;
        }

        // Advance to next player
        state.currentPlayer = (state.currentPlayer + 1) % 4;
        updateUI();

        if (state.mode === 'ai' && state.currentPlayer !== 0 && !state.gameOver) {
          state.aiThinking = true;
          setTimeout(makeAIMove, 600);
        }
      }

      function checkWin(boardState) {
        for (const line of state.winLines) {
          const first = boardState[line[0]];
          if (first !== null) {
            let win = true;
            for (let i = 1; i < state.streak; i++) {
              if (boardState[line[i]] !== first) {
                win = false; break;
              }
            }
            if (win) return { winner: first, line: line };
          }
        }
        return null;
      }

      function handleGameEnd(winner, line) {
        state.gameOver = true;
        dom.boardContainer.classList.add('game-over');
        
        if (winner !== 'D') {
          state.scores[winner]++;
          dom.boardContainer.classList.add('has-winner');
          line.forEach(idx => {
            cellEls[idx].classList.add('winning-cell', `win-${winner}`);
          });
          drawWinLine(line, winner);
        } else {
          state.scores[4]++; // 4 is draw index
        }
        updateUI(winner);
      }

      function drawWinLine(line, winnerIdx) {
        dom.winLineSvg.style.display = 'block';
        const s = state.size;
        const getCoord = (idx) => {
          const row = Math.floor(idx / s); const col = idx % s;
          const cellPct = 100 / s;
          return { x: (col * cellPct) + (cellPct / 2), y: (row * cellPct) + (cellPct / 2) };
        };
        const start = getCoord(line[0]); const end = getCoord(line[line.length - 1]);
        dom.winSvgLine.setAttribute('x1', `${start.x}%`); dom.winSvgLine.setAttribute('y1', `${start.y}%`);
        dom.winSvgLine.setAttribute('x2', `${end.x}%`); dom.winSvgLine.setAttribute('y2', `${end.y}%`);
        
        // Color the line matching the player
        dom.winSvgLine.style.stroke = COLORS[winnerIdx];
        dom.winSvgLine.style.filter = `drop-shadow(0 0 10px ${COLORS[winnerIdx]})`;
      }

      function shakeCell(index) {
        const cell = cellEls[index];
        cell.classList.add('shake');
        setTimeout(() => cell.classList.remove('shake'), 320);
      }

      function updateUI(winnerCode = null) {
        dom.modeBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === state.mode));
        dom.diffBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.diff === state.difficulty));
        dom.sizeBtns.forEach(btn => btn.classList.toggle('active', parseInt(btn.dataset.size) === state.size));
        dom.diffGroup.style.display = state.mode === 'ai' ? 'flex' : 'none';

        const names = PLAYER_NAMES[state.mode];
        for (let i = 0; i < 4; i++) {
            dom.labels[i].textContent = names[i];
            dom.scoreEls[i].textContent = state.scores[i];
            dom.scoreCards[i].classList.remove(`active-turn-${i}`);
        }
        dom.scoreEls[4].textContent = state.scores[4]; // Draws

        if (!state.gameOver) {
            dom.scoreCards[state.currentPlayer].classList.add(`active-turn-${state.currentPlayer}`);
        }

        dom.statusLine.className = 'status-line';
        if (state.gameOver) {
          if (winnerCode !== 'D') {
            const winnerName = names[winnerCode].replace(/\s\(.*?\)/, ''); // Remove symbol in brackets for cleaner look
            dom.statusLine.textContent = `${winnerName} WINS!`;
            dom.statusLine.classList.add(`status-${winnerCode}`);
          } else {
            dom.statusLine.textContent = 'MATCH DRAWN!';
            dom.statusLine.style.color = '#fff';
            dom.statusLine.style.textShadow = 'none';
          }
        } else {
            const curName = names[state.currentPlayer].replace(/\s\(.*?\)/, '');
            dom.statusLine.textContent = `${curName}'S TURN`;
            dom.statusLine.classList.add(`status-${state.currentPlayer}`);
        }
      }

      function startRound(forceReset = false) {
        if (forceReset) state.startingPlayer = 0;
        else state.startingPlayer = (state.startingPlayer + 1) % 4;

        state.currentPlayer = state.startingPlayer;
        state.gameOver = false;
        state.aiThinking = false;
        state.board.fill(null);
        state.lastMoveIdx = null;

        dom.winLineSvg.style.display = 'none';
        dom.boardContainer.classList.remove('has-winner', 'game-over');
        
        cellEls.forEach(cell => {
          cell.innerHTML = '';
          cell.className = 'cell';
        });

        updateUI();

        if (state.mode === 'ai' && state.currentPlayer !== 0) {
          state.aiThinking = true;
          setTimeout(makeAIMove, 600);
        }
      }

      function attachEventListeners() {
        dom.modeBtns.forEach(btn => btn.addEventListener('click', (e) => {
          if (state.mode === e.target.dataset.mode) return;
          state.mode = e.target.dataset.mode;
          state.scores.fill(0);
          startRound(true);
        }));

        dom.diffBtns.forEach(btn => btn.addEventListener('click', (e) => {
          if (state.difficulty === e.target.dataset.diff) return;
          state.difficulty = e.target.dataset.diff;
          state.scores.fill(0);
          startRound(true);
        }));

        dom.sizeBtns.forEach(btn => btn.addEventListener('click', (e) => {
          const newSize = parseInt(e.target.dataset.size);
          if (state.size === newSize) return;
          state.size = newSize;
          state.scores.fill(0);
          generateWinLines();
          buildBoardDOM();
          startRound(true);
        }));

        dom.btnNewRound.addEventListener('click', () => startRound(false));
        dom.btnResetScores.addEventListener('click', () => {
          state.scores.fill(0);
          updateUI();
        });
      }

      function getLegalMoves(b) {
        const moves = [];
        for (let i = 0; i < b.length; i++) if (b[i] === null) moves.push(i);
        return moves;
      }

      // 4-Player heuristic evaluation
      function evaluateMove(board, move, playerIdx) {
        let score = 0;
        board[move] = playerIdx;
        
        // Instant win Check
        if (checkWin(board)) {
            board[move] = null;
            return 100000;
        }
        
        // Instant block check: Could any opponent win here on their next turn?
        let maxOpponentThreat = 0;
        for (let op = 0; op < 4; op++) {
            if (op === playerIdx) continue;
            board[move] = op;
            if (checkWin(board)) {
                // Determine urgency based on turn order
                const turnsUntilOp = (op - playerIdx + 4) % 4;
                const urgencyScore = 10000 - turnsUntilOp * 1000; // Prioritize blocking next player
                maxOpponentThreat = Math.max(maxOpponentThreat, urgencyScore);
            }
        }
        if (maxOpponentThreat > 0) {
            board[move] = null;
            return maxOpponentThreat;
        }

        // Heuristic scoring for non-critical moves
        board[move] = playerIdx; // restore
        for (const line of state.winLines) {
            if (!line.includes(move)) continue;

            const counts = [0, 0, 0, 0];
            let empty = 0;
            for (const idx of line) {
                const p = board[idx];
                if (p !== null) counts[p]++;
                else empty++;
            }

            // If line only has my pieces and empty cells (valid potential win)
            if (counts[playerIdx] > 0 && counts.every((c, i) => i === playerIdx || c === 0)) {
                score += Math.pow(10, counts[playerIdx]); 
            }
            
            // If line only has ONE opponent's pieces and empty cells (blocking them)
            board[move] = null; // look at the state before I moved
            const oldCounts = [...counts];
            oldCounts[playerIdx]--; // remove my virtual piece
            empty++;
            
            for(let op=0; op<4; op++) {
                if(op === playerIdx) continue;
                if(oldCounts[op] > 0 && oldCounts.every((c, i) => i === op || c === 0)) {
                    // I just blocked their line
                    score += Math.pow(8, oldCounts[op]);
                }
            }
            board[move] = playerIdx; // put it back for the rest of loop
        }
        
        // Add a tiny bonus for centralizing
        const center = Math.floor(state.size / 2);
        const row = Math.floor(move / state.size);
        const col = move % state.size;
        const distFromCenter = Math.abs(row - center) + Math.abs(col - center);
        score -= distFromCenter * 0.5;

        board[move] = null;
        return score;
      }

      function makeAIMove() {
        if (state.gameOver) return;
        const moves = getLegalMoves(state.board);
        if (moves.length === 0) return;

        let bestMove = moves[Math.floor(Math.random() * moves.length)];

        if (state.difficulty === 'easy') {
            // Keep random
        } else if (state.difficulty === 'medium') {
            // Check for immediate wins or blocks only
            let bestScore = -1;
            for (let m of moves) {
                const score = evaluateMove(state.board, m, state.currentPlayer);
                // Medium only cares if score is massive (win or block)
                if (score > 1000) {
                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = m;
                    }
                }
            }
            // If no instant win/block, it stays random
        } else {
            // Hard: Full heuristic evaluation for every move
            let bestScore = -Infinity;
            let picks = [];
            
            for (let m of moves) {
                const score = evaluateMove(state.board, m, state.currentPlayer);
                // Add slight variance to avoid repetitive AI games
                const variedScore = score + (Math.random() * 2);
                
                if (variedScore > bestScore) {
                    bestScore = variedScore;
                    picks = [m];
                } else if (variedScore === bestScore) {
                    picks.push(m);
                }
            }
            if(picks.length > 0) bestMove = picks[Math.floor(Math.random() * picks.length)];
        }

        state.aiThinking = false;
        executeMove(bestMove, state.currentPlayer);
      }

      init();
    })();
  </script>
