<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memory Master | Gaming Lab</title>
    
    <!-- Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts Merged -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-accent: #00eaff;
            --secondary-accent: #b900ff; 
            --text-main: #ffffff;
            --bg-dark: #050b14;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            color: var(--text-main);
            overflow-x: hidden;
            background-color: var(--bg-dark);
            background: linear-gradient(135deg, rgba(5,11,20,0.92) 0%, rgba(10,25,47,0.85) 100%), url('https://image2url.com/images/1763374021173-7883e334-bb59-434f-a32d-83e8604794f2.jpeg') no-repeat center center/cover;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Ambient Background FX */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px; z-index: -1; pointer-events: none; opacity: 0.5;
        }
        .bg-glow {
            position: fixed; top: 50%; left: 50%; width: 80vw; height: 80vw;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(0, 234, 255, 0.05) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%; z-index: -2;
        }

        /* Navigation */
        .top-nav {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,234,255,0.2);
            z-index: 10;
        }
        .back-btn {
            color: var(--text-main); text-decoration: none; font-size: 1.1rem;
            display: flex; align-items: center; gap: 10px; transition: 0.3s;
        }
        .back-btn:hover { color: var(--primary-accent); text-shadow: 0 0 10px var(--primary-accent); }

        .game-wrapper {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-ui { 
            text-align: center; 
            animation: cinematicFocus 0.6s cubic-bezier(0.25, 1, 0.5, 1); 
            width: 100%; 
            max-width: 550px; 
            background: rgba(15,15,20,0.9); 
            padding: 40px; 
            border-radius: 30px; 
            border: 1px solid rgba(0,234,255,0.3); 
            box-shadow: 0 0 60px rgba(0,234,255,0.15), inset 0 0 30px rgba(0,234,255,0.05); 
            position: relative;
            backdrop-filter: blur(10px);
        }

        /* Memory Game Specifics */
        .memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 15px; 
            margin: 30px auto; 
            max-width: 450px; 
            perspective: 1000px; 
        }
        
        .memory-card { 
            height: 100px; 
            cursor: pointer; 
            position: relative; 
            transform-style: preserve-3d; 
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        
        .memory-card.flipped { transform: rotateY(180deg); }
        
        .front, .back { 
            width: 100%; height: 100%; 
            position: absolute; 
            border-radius: 15px; 
            display: flex; justify-content: center; align-items: center; 
            font-size: 40px; 
            backface-visibility: hidden; 
            border: 2px solid rgba(0,234,255,0.2); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.6); 
        }
        
        .front { 
            background: rgba(10,10,15,0.9); 
            color: var(--primary-accent); 
            transform: rotateY(180deg); 
            text-shadow: 0 0 20px rgba(0,234,255,0.5);
        }
        
        .back { 
            background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent)); 
            color: black; 
            font-size: 32px; font-weight: 900; 
            text-shadow: 0 2px 5px rgba(255,255,255,0.5); 
        }
        
        .memory-card:hover:not(.flipped) .back { 
            box-shadow: 0 0 20px rgba(0,234,255,0.5); 
            border-color: #fff;
        }

        .btn-hero {
            padding: 15px 40px; border-radius: 15px; border: 1px solid var(--primary-accent); cursor: pointer;
            background: transparent; color: #fff; font-weight: 700; font-size: 1.1rem; transition: 0.3s; text-transform: uppercase;
            width: 100%;
        }
        .btn-hero:hover { 
            background: var(--primary-accent); color: black; 
            box-shadow: 0 0 20px rgba(0,234,255,0.4); transform: scale(1.02); 
        }

        @keyframes cinematicFocus {
            from { opacity: 0; transform: scale(0.9) translateY(20px); filter: blur(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0px); }
        }

        @media (max-width: 500px) {
            .game-ui { padding: 30px 20px; }
            .memory-grid { gap: 10px; }
            .memory-card { height: 80px; }
            .front, .back { font-size: 30px; }
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div class="bg-glow"></div>

    <nav class="top-nav">
        <a href="games.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Lab Terminal</a>
        <h2 style="margin:0; font-weight: 700; letter-spacing: 2px; color: var(--primary-accent); text-transform: uppercase; font-size: 1.2rem;">Memory</h2>
    </nav>

    <div class="game-wrapper">
        <div class="game-ui">
            <h2 style="color:var(--primary-accent); margin-top:0; font-size:2.5rem; text-transform:uppercase; font-weight: 800;">Memory Master</h2>
            
            <div class="memory-grid" id="memoryGrid"></div>
            
            <h3 id="memoryStatus" style="color:var(--text-main); height:35px; margin: 15px 0; font-size: 1.2rem;"></h3>
            
            <div style="display:flex; gap:15px; justify-content:center;">
                <button class="btn-hero" onclick="initMemory()"><i class="fa-solid fa-rotate-right"></i> Restart System</button>
            </div>
        </div>
    </div>

    <script>
        const icons = ['🍎','🍌','🍇','🍒','🚀','⚽','💎','🍕'];
        let memoryCards = [...icons, ...icons];
        let firstCard = null, secondCard = null, lockBoard = false;

        function initMemory() {
            const grid = document.getElementById("memoryGrid"); 
            grid.innerHTML = "";
            // Shuffle cards
            memoryCards.sort(() => 0.5 - Math.random());
            
            document.getElementById("memoryStatus").innerText = "Match all pairs to win!";
            document.getElementById("memoryStatus").style.color = "var(--text-muted)";
            
            firstCard = null; 
            secondCard = null;
            lockBoard = false;

            // Generate DOM elements
            memoryCards.forEach(icon => {
                const card = document.createElement("div"); 
                card.classList.add("memory-card"); 
                card.dataset.icon = icon;
                card.innerHTML = `<div class="front">${icon}</div><div class="back">?</div>`;
                card.onclick = flipCard; 
                grid.appendChild(card);
            });
        }

        function flipCard() {
            if (lockBoard || this === firstCard || this.classList.contains("flipped")) return;
            
            this.classList.add("flipped");
            
            if (!firstCard) { 
                firstCard = this; 
                return; 
            }
            
            secondCard = this; 
            checkMatch();
        }

        function checkMatch() {
            let isMatch = firstCard.dataset.icon === secondCard.dataset.icon;
            if (isMatch) { 
                disableCards(); 
            } else { 
                unflipCards(); 
            }
        }

        function disableCards() {
            firstCard = null; 
            secondCard = null;
            
            // Check if all cards are flipped
            if(document.querySelectorAll('.flipped').length === memoryCards.length) {
                document.getElementById("memoryStatus").innerText = "🎉 All systems restored! You Win!";
                document.getElementById("memoryStatus").style.color = "var(--primary-accent)";
            }
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                firstCard.classList.remove("flipped"); 
                secondCard.classList.remove("flipped");
                firstCard = null; 
                secondCard = null; 
                lockBoard = false;
            }, 1000);
        }

        // Auto-start on load
        window.onload = initMemory;
    </script>
</body>
</html>
