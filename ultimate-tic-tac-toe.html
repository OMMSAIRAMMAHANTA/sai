<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Tic-Tac-Toe | Gaming Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --x:#00eaff; --o:#ff4466; --gold:#ffd54a; --bg:#050b14; }
        * { box-sizing:border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            min-height:100vh; font-family:'Poppins',sans-serif; color:#fff; display:flex; flex-direction:column;
            background: linear-gradient(135deg, rgba(5,11,20,.93) 0%, rgba(10,25,47,.88) 100%),
                        url('https://image2url.com/images/1763374021173-7883e334-bb59-434f-a32d-83e8604794f2.jpeg') no-repeat center/cover fixed;
            background-color:var(--bg);
        }
        .scan { position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.35;
            background:repeating-linear-gradient(to bottom, rgba(255,255,255,0) 0 2px, rgba(0,0,0,.18) 2px 4px); }
        nav { padding:16px 28px; display:flex; justify-content:space-between; align-items:center;
            background:rgba(0,0,0,.3); backdrop-filter:blur(10px); border-bottom:1px solid rgba(0,234,255,.2); }
        nav a { color:#fff; text-decoration:none; font-weight:600; transition:.25s; }
        nav a:hover { color:var(--x); text-shadow:0 0 10px var(--x); }
        nav h2 { margin:0; font-size:1.05rem; letter-spacing:2px; text-transform:uppercase; color:var(--x); }

        main { flex:1; display:flex; justify-content:center; align-items:flex-start; padding:20px; }
        .card { width:100%; max-width:640px; text-align:center; padding:26px 22px 28px; border-radius:28px;
            background:rgba(15,15,20,.88); backdrop-filter:blur(10px); border:1px solid rgba(0,234,255,.3);
            box-shadow:0 0 60px rgba(0,234,255,.14), inset 0 0 30px rgba(0,234,255,.05);
            animation:cardIn .6s cubic-bezier(.2,.8,.2,1); }
        @keyframes cardIn { from { opacity:0; transform:translateY(24px) scale(.95); filter:blur(8px); } }
        
        h1 { margin:0 0 6px; font-size:1.9rem; font-weight:900; text-transform:uppercase; letter-spacing:2px; color:var(--x); text-shadow:0 0 18px rgba(0,234,255,.5); }
        .rule { margin:0 0 14px; font-size:.78rem; color:#9aa; line-height:1.4; }
        .rule span { color:var(--x); font-weight: 700; }

        .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:12px; }
        .btn { padding:9px 16px; border-radius:30px; border:1px solid rgba(255,255,255,.22); background:transparent; color:#fff; cursor:pointer;
            font:700 .76rem 'Poppins',sans-serif; text-transform:uppercase; transition:.25s; }
        .btn:hover { background:rgba(0,234,255,.12); border-color:var(--x); transform:scale(1.05); }
        .btn.active { background:var(--x); color:#000; border-color:var(--x); box-shadow:0 0 15px rgba(0,234,255,.45); }
        .btn.hard.active { background:linear-gradient(45deg,#ff4466,#aa0022); color:#fff; border-color:var(--o); box-shadow:0 0 15px rgba(255,68,102,.5); }
        .btn.wide { width:100%; border-radius:14px; padding:13px; font-size:.95rem; border-color:var(--x); margin-top: 10px; }
        .hidden { display:none !important; }

        .scoreboard { display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; margin:6px 0 10px; }
        .sc { padding:8px 10px; border-radius:14px; background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.1); transition:.3s; }
        .sc .nm { font-size:.74rem; color:#bbb; text-transform: uppercase; font-weight: 700; letter-spacing: 1px;}
        .sc .pts { font-size:1.6rem; font-weight:800; }
        .sc.x .pts { color:var(--x); } .sc.o .pts { color:var(--o); }
        .sc.turn { transform:scale(1.06); }
        .sc.x.turn { border-color:var(--x); box-shadow:0 0 18px rgba(0,234,255,.35); }
        .sc.o.turn { border-color:var(--o); box-shadow:0 0 18px rgba(255,68,102,.35); }
        .dr { font-size:.74rem; color:#aaa; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; } 
        .dr b { display:block; font-size:1.2rem; color:#fff; margin-top: 2px;}

        #status { min-height:1.7em; font-weight:800; letter-spacing:1px; margin:6px 0 14px; color:var(--x); transition:color .25s; text-transform: uppercase; }

        .board-container {
            width: 100%; max-width: 480px; margin: 0 auto; aspect-ratio: 1;
            background: rgba(3, 8, 16, 0.65); border-radius: 16px; border: 1px solid rgba(0, 234, 255, 0.2);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.7); padding: 8px; position: relative;
        }

        .macro-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
            width: 100%; height: 100%; gap: 6px;
        }

        .macro-cell {
            background: rgba(10, 22, 40, 0.4); border: 2px solid rgba(0, 234, 255, 0.1); border-radius: 8px;
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
            gap: 3px; padding: 4px; position: relative; transition: all 0.3s ease;
        }

        /* Active macro board highlight */
        .macro-cell.active-macro {
            background: rgba(10, 22, 40, 0.9);
            border-color: var(--x); box-shadow: 0 0 15px rgba(0, 234, 255, 0.25), inset 0 0 10px rgba(0, 234, 255, 0.1);
        }
        .macro-cell.active-macro-o {
            background: rgba(10, 22, 40, 0.9);
            border-color: var(--o); box-shadow: 0 0 15px rgba(255, 68, 102, 0.25), inset 0 0 10px rgba(255, 68, 102, 0.1);
        }
        
        .macro-cell.inactive-macro { opacity: 0.45; filter: grayscale(60%); pointer-events: none; }

        .micro-cell {
            background: rgba(14, 29, 51, 0.45); border: 1px solid rgba(0, 234, 255, 0.08); border-radius: 4px;
            display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative;
            transition: all 0.15s ease;
        }

        .macro-cell:not(.inactive-macro) .micro-cell:empty:hover {
            background: rgba(0, 234, 255, 0.15); border-color: rgba(0, 234, 255, 0.5);
        }

        .micro-cell.last-move {
            background: rgba(255, 255, 255, 0.1); box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.15);
        }

        /* Giant SVG Overlay for won macro boards */
        .macro-overlay {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            background: rgba(5, 11, 20, 0.85); backdrop-filter: blur(2px); border-radius: 6px;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease; z-index: 5;
        }
        .macro-cell.won-x .macro-overlay, .macro-cell.won-o .macro-overlay, .macro-cell.draw .macro-overlay { opacity: 1; }
        .macro-cell.won-x { border-color: var(--x); }
        .macro-cell.won-o { border-color: var(--o); }
        .macro-cell.draw { border-color: #64748b; }
        
        .macro-overlay .mark-svg { width: 85%; height: 85%; filter: drop-shadow(0 0 15px currentColor); }

        .mark-svg { width: 75%; height: 75%; pointer-events: none; }
        .mark-x { stroke: var(--x); filter: drop-shadow(0 0 6px rgba(0, 234, 255, 0.5)); }
        .mark-o { stroke: var(--o); filter: drop-shadow(0 0 6px rgba(255, 68, 102, 0.5)); }
        
        @keyframes drawStroke { to { stroke-dashoffset: 0; } }
        .mark-x path { stroke-dasharray: 1; stroke-dashoffset: 1; }
        .mark-x path.s1 { animation: drawStroke 0.2s cubic-bezier(.2,.8,.3,1) forwards; }
        .mark-x path.s2 { animation: drawStroke 0.2s cubic-bezier(.2,.8,.3,1) 0.12s forwards; }
        .mark-o circle { stroke-dasharray: 1; stroke-dashoffset: 1; transform-origin: center; transform: rotate(-90deg); animation: drawStroke 0.35s cubic-bezier(.2,.8,.3,1) forwards; }

        @keyframes winPulse { 
            0%, 100% { border-color: var(--gold); box-shadow: 0 0 15px rgba(255, 213, 74, 0.5); }
            50% { border-color: #fff; box-shadow: 0 0 25px var(--gold); }
        }
        .macro-cell.winning-macro { animation: winPulse 1.5s infinite; z-index: 10; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-4px) rotate(-2deg); } 40% { transform: translateX(4px) rotate(2deg); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
        .shake { animation: shake 0.3s ease-in-out; }

        .win-line-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; }
        .win-line-svg line {
            stroke: var(--gold); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1;
            filter: drop-shadow(0 0 10px var(--gold)); animation: drawStroke 0.5s cubic-bezier(.2,.8,.2,1) forwards;
        }

        @media (max-width: 480px) {
            .card { padding: 20px 12px; }
            h1 { font-size: 1.4rem; }
            nav { padding: 14px 16px; }
            .btn { padding: 8px 12px; }
            .macro-grid { gap: 4px; }
            .macro-cell { gap: 2px; padding: 2px; border-radius: 6px; border-width: 1.5px;}
            .micro-cell { border-radius: 2px; }
            .sc .pts { font-size: 1.4rem; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } .mark-x path, .mark-o circle, .win-line-svg line { stroke-dashoffset: 0 !important; } }
    </style>
</head>
<body>
    <div class="scan"></div>
    <nav>
        <a href="tictactoe-dashboard.html">&larr; Dashboard</a>
        <h2>Ultimate</h2>
    </nav>

    <main>
        <div class="card">
            <h1>Ultimate Tic-Tac-Toe</h1>
            <p class="rule">Win <span>3 boards in a row</span>. Your move dictates the opponent's next board.</p>

            <div class="row">
                <button class="btn active" id="m-ai" onclick="setMode('ai')">vs AI</button>
                <button class="btn" id="m-local" onclick="setMode('local')">2 Players</button>
            </div>
            <div class="row" id="diffRow">
                <button class="btn" id="d-easy" onclick="setDiff('easy')">Easy</button>
                <button class="btn active" id="d-medium" onclick="setDiff('medium')">Medium</button>
                <button class="btn hard" id="d-hard" onclick="setDiff('hard')">Hard</button>
            </div>

            <div class="scoreboard">
                <div class="sc x" id="cardX"><div class="nm" id="nmX">You (X)</div><div class="pts" id="scX">0</div></div>
                <div class="dr">Draws<b id="scD">0</b></div>
                <div class="sc o" id="cardO"><div class="nm" id="nmO">AI (O)</div><div class="pts" id="scO">0</div></div>
            </div>

            <div id="status">Your turn (X)</div>

            <div class="board-container" id="boardContainer">
                <div class="macro-grid" id="macroGrid"></div>
                <svg class="win-line-svg" id="winLineSvg" viewBox="0 0 100 100" preserveAspectRatio="none" style="display: none;">
                    <line id="winSvgLine" x1="0" y1="0" x2="0" y2="0" pathLength="1" />
                </svg>
            </div>

            <button class="btn wide" onclick="startRound(starter === 'X' ? 'O' : 'X')">New Round</button>
            <button class="btn" style="margin-top:10px;" onclick="resetScores()">Reset Scores</button>
        </div>
    </main>

    <script>
        const HUMAN = "X", AI = "O";
        const $ = id => document.getElementById(id);
        const winLines = [[0,1,2], [3,4,5], [6,7,8], [0,3,6], [1,4,7], [2,5,8], [0,4,8], [2,4,6]];

        let mode = "ai", diff = "medium", starter = "X", current = "X";
        let active = false, aiTimer = null;
        let scores = { X: 0, O: 0, D: 0 };
        
        let gameState = {
            macro: Array(9).fill(null),       // Winners of macro boards ('X', 'O', 'D', null)
            micro: Array(9).fill(null).map(()=>Array(9).fill(null)), // 9x9 micro cells
            activeMacro: null,                // The board the current player MUST play in (0-8) or null for any
            lastMove: null                    // {M, m}
        };

        const macroEls = [], microEls = [];

        function buildGrid() {
            const grid = $("macroGrid");
            grid.innerHTML = "";
            for (let M = 0; M < 9; M++) {
                const macEl = document.createElement("div");
                macEl.className = "macro-cell";
                
                const overlay = document.createElement("div");
                overlay.className = "macro-overlay";
                macEl.appendChild(overlay);

                const mArray = [];
                for (let m = 0; m < 9; m++) {
                    const micEl = document.createElement("div");
                    micEl.className = "micro-cell";
                    micEl.onclick = () => handleCellClick(M, m);
                    macEl.appendChild(micEl);
                    mArray.push(micEl);
                }
                grid.appendChild(macEl);
                macroEls.push(macEl);
                microEls.push(mArray);
            }
        }

        function createMarkSvg(p) {
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("viewBox", "0 0 100 100");
            svg.setAttribute("class", `mark-svg ${p === 'X' ? 'mark-x' : 'mark-o'}`);
            if (p === 'X') {
                const p1 = document.createElementNS("http://www.w3.org/2000/svg", "path");
                p1.setAttribute("d", "M 25 25 L 75 75"); p1.setAttribute("stroke-width", "16"); 
                p1.setAttribute("stroke-linecap", "round"); p1.setAttribute("pathLength", "1"); p1.setAttribute("class", "s1");
                const p2 = document.createElementNS("http://www.w3.org/2000/svg", "path");
                p2.setAttribute("d", "M 75 25 L 25 75"); p2.setAttribute("stroke-width", "16"); 
                p2.setAttribute("stroke-linecap", "round"); p2.setAttribute("pathLength", "1"); p2.setAttribute("class", "s2");
                svg.appendChild(p1); svg.appendChild(p2);
            } else {
                const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                c.setAttribute("cx", "50"); c.setAttribute("cy", "50"); c.setAttribute("r", "26");
                c.setAttribute("fill", "none"); c.setAttribute("stroke-width", "16");
                c.setAttribute("stroke-linecap", "round"); c.setAttribute("pathLength", "1");
                svg.appendChild(c);
            }
            return svg;
        }

        function checkWin(board) {
            for (const [a, b, c] of winLines) {
                if (board[a] && board[a] === board[b] && board[a] === board[c]) 
                    return { winner: board[a], line: [a, b, c] };
            }
            if (board.every(c => c !== null && c !== 'D')) return { winner: 'D' };
            return null;
        }

        function handleCellClick(M, m) {
            if (!active || (mode === "ai" && current === AI)) return;
            if (gameState.macro[M] !== null || gameState.micro[M][m] !== null) return shake(M, m);
            if (gameState.activeMacro !== null && gameState.activeMacro !== M) {
                macroEls[gameState.activeMacro].classList.add("shake");
                setTimeout(() => macroEls[gameState.activeMacro].classList.remove("shake"), 300);
                return;
            }
            executeMove(M, m, current);
        }

        function shake(M, m) {
            const el = microEls[M][m];
            el.classList.add("shake");
            setTimeout(() => el.classList.remove("shake"), 300);
        }

        function executeMove(M, m, player) {
            gameState.micro[M][m] = player;
            gameState.lastMove = { M, m };

            // Check micro board win
            const microResult = checkWin(gameState.micro[M]);
            if (microResult) gameState.macro[M] = microResult.winner;

            // Check macro board win
            const macroResult = checkWin(gameState.macro);
            
            if (macroResult) {
                active = false;
                if (macroResult.winner !== 'D') {
                    scores[macroResult.winner]++;
                } else {
                    scores.D++;
                }
                renderBoardChanges(M, m, player, microResult, macroResult);
                finish(macroResult);
                return;
            }

            // Determine next active board
            gameState.activeMacro = gameState.macro[m] !== null ? null : m;
            current = current === 'X' ? 'O' : 'X';
            
            renderBoardChanges(M, m, player, microResult, null);
            updateUI();

            if (mode === "ai" && current === AI && active) {
                aiTimer = setTimeout(makeAIMove, 600);
            }
        }

        function renderBoardChanges(M, m, player, microResult, macroResult) {
            // Remove old last-move indicator
            document.querySelectorAll(".last-move").forEach(el => el.classList.remove("last-move"));
            
            // Draw new mark
            const micEl = microEls[M][m];
            micEl.appendChild(createMarkSvg(player));
            micEl.classList.add("last-move");

            // Handle won macro board overlay
            const macEl = macroEls[M];
            if (microResult) {
                if (microResult.winner === 'X') macEl.classList.add('won-x');
                else if (microResult.winner === 'O') macEl.classList.add('won-o');
                else macEl.classList.add('draw');
                
                const overlay = macEl.querySelector('.macro-overlay');
                if (microResult.winner !== 'D') {
                    overlay.innerHTML = '';
                    overlay.appendChild(createMarkSvg(microResult.winner));
                }
            }

            // Update macro board highlights
            macroEls.forEach((el, idx) => {
                el.classList.remove("active-macro", "active-macro-o", "inactive-macro");
                if (!active) return; // Wait for finish() to handle game over states
                
                if (gameState.macro[idx] !== null) {
                    el.classList.add("inactive-macro");
                } else {
                    if (gameState.activeMacro === null || gameState.activeMacro === idx) {
                        el.classList.add(current === 'X' ? 'active-macro' : 'active-macro-o');
                    } else {
                        el.classList.add("inactive-macro");
                    }
                }
            });

            if (macroResult && macroResult.winner !== 'D') {
                macroResult.line.forEach(idx => macroEls[idx].classList.add("winning-macro"));
                drawWinLine(macroResult.line);
            }
        }

        function drawWinLine(line) {
            const svg = $("winLineSvg");
            const lineEl = $("winSvgLine");
            svg.style.display = 'block';
            
            const getCoord = (idx) => {
                const row = Math.floor(idx / 3), col = idx % 3;
                return { x: (col * 33.33) + 16.66, y: (row * 33.33) + 16.66 };
            };
            const s = getCoord(line[0]), e = getCoord(line[2]);
            
            lineEl.setAttribute('x1', `${s.x}%`); lineEl.setAttribute('y1', `${s.y}%`);
            lineEl.setAttribute('x2', `${e.x}%`); lineEl.setAttribute('y2', `${e.y}%`);
        }

        function setMode(m) {
            mode = m;
            $("m-ai").classList.toggle("active", m === "ai");
            $("m-local").classList.toggle("active", m === "local");
            $("diffRow").classList.toggle("hidden", m !== "ai");
            $("nmX").textContent = m === "ai" ? "You (X)" : "Player 1 (X)";
            $("nmO").textContent = m === "ai" ? "AI (O)" : "Player 2 (O)";
            resetScores();
        }

        function setDiff(d) {
            diff = d;
            ["easy", "medium", "hard"].forEach(k => $("d-" + k).classList.toggle("active", k === d));
            resetScores();
        }

        function resetScores() {
            scores = { X: 0, O: 0, D: 0 };
            renderScores();
            startRound("X");
        }

        function renderScores() {
            $("scX").textContent = scores.X;
            $("scO").textContent = scores.O;
            $("scD").textContent = scores.D;
        }

        function startRound(first) {
            clearTimeout(aiTimer);
            starter = first; current = first; active = true;
            
            gameState.macro.fill(null);
            gameState.micro.forEach(arr => arr.fill(null));
            gameState.activeMacro = null;
            gameState.lastMove = null;

            $("winLineSvg").style.display = 'none';
            macroEls.forEach((el, M) => {
                el.className = "macro-cell";
                if (current === 'X') el.classList.add('active-macro');
                else el.classList.add('active-macro-o');
                el.querySelector('.macro-overlay').innerHTML = "";
                microEls[M].forEach(mEl => { mEl.innerHTML = ""; mEl.className = "micro-cell"; });
            });

            updateUI();
            if (mode === "ai" && current === AI) scheduleAI();
        }

        function finish(res) {
            renderScores();
            let msg = res.winner === 'D' ? "Match Drawn!" : 
                (mode === "ai" ? (res.winner === HUMAN ? "🏆 You win!" : "🤖 AI wins!") : 
                "🏆 Player " + (res.winner === 'X' ? '1' : '2') + " wins!");
            
            $("status").textContent = msg;
            $("status").style.color = res.winner === 'D' ? "var(--gold)" : (res.winner === 'X' ? "var(--x)" : "var(--o)");
            $("cardX").classList.remove("turn"); $("cardO").classList.remove("turn");
            
            // Dim all cells appropriately
            macroEls.forEach(el => el.classList.remove("active-macro", "active-macro-o"));
        }

        function updateUI() {
            if (!active) return;
            $("cardX").classList.toggle("turn", current === 'X');
            $("cardO").classList.toggle("turn", current === 'O');
            $("status").style.color = current === 'X' ? "var(--x)" : "var(--o)";
            
            if (mode === "ai") {
                $("status").textContent = current === HUMAN ? "Your turn (X)" : "AI is thinking...";
            } else {
                $("status").textContent = `Player ${current === 'X' ? '1' : '2'}'s turn (${current})`;
            }
        }

        function scheduleAI() {
            if (!active) return;
            aiTimer = setTimeout(makeAIMove, Math.random() * 200 + 400); // 400-600ms feeling
        }

        function getLegalMoves(st) {
            const moves = [];
            const targets = st.activeMacro === null ? [0,1,2,3,4,5,6,7,8] : [st.activeMacro];
            for (const M of targets) {
                if (st.macro[M] !== null) continue;
                for (let m = 0; m < 9; m++) {
                    if (st.micro[M][m] === null) moves.push({M, m});
                }
            }
            return moves;
        }

        // Fast state simulator for AI tree
        function simMove(st, move, p) {
            const nSt = { macro: [...st.macro], micro: st.micro.map(r => [...r]), activeMacro: st.activeMacro };
            nSt.micro[move.M][move.m] = p;
            const res = checkWin(nSt.micro[move.M]);
            if (res) nSt.macro[move.M] = res.winner;
            nSt.activeMacro = nSt.macro[move.m] !== null ? null : move.m;
            return nSt;
        }

        function evaluateLine(b, p) {
            let score = 0;
            for (const [a, b_idx, c] of winLines) {
                let pCnt = 0, eCnt = 0;
                if (b[a] === p) pCnt++; else if (b[a] === null) eCnt++;
                if (b[b_idx] === p) pCnt++; else if (b[b_idx] === null) eCnt++;
                if (b[c] === p) pCnt++; else if (b[c] === null) eCnt++;
                
                if (pCnt === 2 && eCnt === 1) score += 10;
                else if (pCnt === 1 && eCnt === 2) score += 1;
            }
            return score;
        }

        function evaluateBoard(st) {
            const win = checkWin(st.macro);
            if (win) return win.winner === AI ? 10000 : (win.winner === HUMAN ? -10000 : 0);

            let score = 0;
            // 1. Evaluate macro board control
            for (let M = 0; M < 9; M++) {
                if (st.macro[M] === AI) score += 100;
                else if (st.macro[M] === HUMAN) score -= 100;
                else {
                    // 2. Evaluate active micro boards
                    score += evaluateLine(st.micro[M], AI) * 1.5;
                    score -= evaluateLine(st.micro[M], HUMAN) * 1.5;
                    // Slight preference for center/corners in micro
                    if (st.micro[M][4] === AI) score += 1;
                    if (st.micro[M][4] === HUMAN) score -= 1;
                }
            }
            // 3. Evaluate macro board potential lines
            score += evaluateLine(st.macro, AI) * 50;
            score -= evaluateLine(st.macro, HUMAN) * 50;

            return score;
        }

        function minimax(st, depth, alpha, beta, maxing) {
            if (depth === 0) return evaluateBoard(st);
            const win = checkWin(st.macro);
            if (win) return win.winner === AI ? 10000 + depth : (win.winner === HUMAN ? -10000 - depth : 0);

            const moves = getLegalMoves(st);
            if (moves.length === 0) return 0;

            if (maxing) {
                let maxEv = -Infinity;
                for (const m of moves) {
                    const ev = minimax(simMove(st, m, AI), depth - 1, alpha, beta, false);
                    maxEv = Math.max(maxEv, ev);
                    alpha = Math.max(alpha, ev);
                    if (beta <= alpha) break;
                }
                return maxEv;
            } else {
                let minEv = Infinity;
                for (const m of moves) {
                    const ev = minimax(simMove(st, m, HUMAN), depth - 1, alpha, beta, true);
                    minEv = Math.min(minEv, ev);
                    beta = Math.min(beta, ev);
                    if (beta <= alpha) break;
                }
                return minEv;
            }
        }

        function makeAIMove() {
            if (!active) return;
            const moves = getLegalMoves(gameState);
            if (moves.length === 0) return;

            let bestM = moves[Math.floor(Math.random() * moves.length)];

            if (diff === "easy") {
                // Keep random
            } else if (diff === "medium") {
                // 1-ply lookahead with heuristic (greedy)
                let bestScore = -Infinity;
                for (const m of moves) {
                    const nSt = simMove(gameState, m, AI);
                    let score = evaluateBoard(nSt);
                    score += Math.random() * 5; // adds variance
                    if (score > bestScore) { bestScore = score; bestM = m; }
                }
            } else {
                // Hard: Alpha-Beta. Adjust depth dynamically to avoid freezing on "any board" state
                // If activeMacro is null, branching factor is ~60-80. Depth 2-3 max.
                // If restricted, branching is max 9. Depth 4-5 is safe.
                let searchDepth = gameState.activeMacro === null ? 3 : 5;
                
                // Opening optimizations (don't search deep on very first turn if restricted)
                if (moves.length > 70) searchDepth = 2; 

                let bestScore = -Infinity, picks = [];
                for (const m of moves) {
                    const nSt = simMove(gameState, m, AI);
                    const score = minimax(nSt, searchDepth - 1, -Infinity, Infinity, false);
                    if (score > bestScore) {
                        bestScore = score; picks = [m];
                    } else if (score === bestScore) {
                        picks.push(m);
                    }
                }
                bestM = picks[Math.floor(Math.random() * picks.length)];
            }
            executeMove(bestM.M, bestM.m, AI);
        }

        // Boot
        buildGrid();
        setMode("ai");
    </script>
