<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Omm Sairam Mahanta | Tic Tac Toe</title>
    
    <!-- Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-accent: #00eaff;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.62);
            --bg-dark: #040508;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-main);
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* Deep Black Background with Subtle Red & Blue Ambient Lighting */
        .ambient-stage {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: 
                radial-gradient(circle at 50% 46%, rgba(190, 24, 38, 0.2) 0%, rgba(120, 15, 28, 0.08) 36%, transparent 68%),
                radial-gradient(circle at 22% 65%, rgba(29, 78, 216, 0.14) 0%, transparent 55%),
                radial-gradient(circle at 78% 35%, rgba(0, 234, 255, 0.1) 0%, transparent 55%),
                linear-gradient(180deg, #030407 0%, #070910 50%, #030407 100%);
        }

        .ambient-glow {
            position: fixed;
            top: 48%;
            left: 50%;
            width: min(560px, 90vw);
            height: min(380px, 60vh);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, var(--active-glow, rgba(245, 158, 11, 0.28)) 0%, transparent 70%);
            z-index: 1;
            pointer-events: none;
            transition: background 0.5s ease;
        }

        /* Floating Back, Navigation & Music Controls */
        .back-btn,
        .hamburger-btn,
        .music-btn {
            position: fixed;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(8, 12, 22, 0.78);
            border: 1.5px solid var(--primary-accent);
            color: var(--primary-accent);
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 18px rgba(0, 234, 255, 0.18);
            transition: transform 0.3s ease, background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
        }

        .back-btn {
            top: 28px;
            left: 28px;
            z-index: 10000;
        }

        .hamburger-btn {
            top: 28px;
            right: 28px;
            z-index: 10000;
        }

        .music-btn {
            bottom: 28px;
            right: 28px;
            z-index: 9997;
        }

        .back-btn:hover,
        .hamburger-btn:hover,
        .music-btn:hover {
            transform: scale(1.08);
            background: var(--primary-accent);
            color: #000;
            box-shadow: 0 0 22px rgba(0, 234, 255, 0.5);
        }

        /* Full Screen Menu */
        .full-menu {
            position: fixed;
            inset: 0;
            background: rgba(3, 5, 10, 0.97);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 32px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        .full-menu.open {
            opacity: 1;
            pointer-events: all;
        }

        .full-menu a {
            font-size: 2.2rem;
            color: transparent;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.32);
            opacity: 0;
            transform: translateY(24px);
            transition: color 0.3s ease, -webkit-text-stroke 0.3s ease, transform 0.3s ease, letter-spacing 0.3s ease;
        }

        .full-menu.open a {
            opacity: 1;
            transform: translateY(0);
        }

        .full-menu a:hover,
        .full-menu a.active-link {
            color: var(--primary-accent);
            -webkit-text-stroke: 1.5px var(--primary-accent);
            text-shadow: 0 0 18px rgba(0, 234, 255, 0.45);
            transform: scale(1.04);
            letter-spacing: 5px;
        }

        /* Main Showcase Container */
        .content-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .carousel-viewport {
            width: 100%;
            display: flex;
            align-items: center;
            overflow-x: auto;
            overflow-y: visible;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding: 36px 0;
            cursor: grab;
        }

        .carousel-viewport:active {
            cursor: grabbing;
        }

        .carousel-viewport::-webkit-scrollbar {
            display: none;
        }

        .carousel-track {
            display: flex;
            align-items: center;
            gap: 22px;
            padding: 0 calc(50vw - 115px);
            margin: 0 auto;
        }

        /* Poster Card */
        .mode-poster {
            position: relative;
            width: 230px;
            height: 334px;
            border-radius: 18px;
            overflow: hidden;
            flex-shrink: 0;
            scroll-snap-align: center;
            text-decoration: none;
            color: #fff;
            background: #0c1018;
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.72);
            transform: scale(0.84);
            opacity: 0.46;
            filter: brightness(0.72) saturate(0.85);
            transition: 
                transform 0.42s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.42s cubic-bezier(0.22, 1, 0.36, 1),
                filter 0.42s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 0.35s ease,
                box-shadow 0.42s ease;
            will-change: transform, opacity;
        }

        .mode-poster.is-neighbor {
            transform: scale(0.9);
            opacity: 0.72;
            filter: brightness(0.86) saturate(0.95);
        }

        .mode-poster.is-active {
            transform: scale(1.06);
            opacity: 1;
            filter: brightness(1) saturate(1.05);
            border-color: rgba(255, 255, 255, 0.24);
            box-shadow: 0 26px 56px rgba(0, 0, 0, 0.88), 0 0 32px rgba(255, 255, 255, 0.06);
            z-index: 5;
        }

        .poster-media {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .poster-media svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .mode-poster.is-active:hover .poster-media svg {
            transform: scale(1.04);
        }

        /* Dark Gradient Overlay for Text Readability */
        .poster-shade {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(4, 6, 12, 0.32) 0%,
                rgba(4, 6, 12, 0.04) 34%,
                rgba(4, 6, 12, 0.72) 70%,
                rgba(3, 5, 10, 0.96) 100%
            );
            pointer-events: none;
        }

        /* Subtle Top Icon Badge */
        .poster-top {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
            pointer-events: none;
        }

        .mode-emblem {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.74rem;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
        }

        /* Bottom Info Overlay */
        .poster-info {
            position: absolute;
            left: 16px;
            right: 16px;
            bottom: 16px;
            z-index: 2;
            pointer-events: none;
        }

        .poster-title {
            font-size: 1.18rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.22;
            color: #ffffff;
            margin-bottom: 8px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85);
        }

        .poster-tags {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tag-pill {
            font-size: 0.68rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.84);
            background: rgba(255, 255, 255, 0.12);
            padding: 3px 9px;
            border-radius: 999px;
            letter-spacing: 0.01em;
        }

        .tag-sub {
            font-size: 0.68rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        /* Subtle Carousel Progress Bar & Counter */
        .carousel-status {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
            z-index: 10;
        }

        .progress-track {
            width: 140px;
            height: 4px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 10%;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.85);
            transition: width 0.25s ease;
        }

        .counter-label {
            font-size: 0.72rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: 0.06em;
            font-variant-numeric: tabular-nums;
        }

        footer {
            position: fixed;
            bottom: 14px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.28);
            font-size: 0.74rem;
            letter-spacing: 0.6px;
            pointer-events: none;
            z-index: 5;
        }

        /* Compact Mobile Optimization */
        @media (max-width: 640px) {
            .back-btn {
                top: 18px;
                left: 18px;
                width: 42px;
                height: 42px;
                font-size: 16px;
            }

            .hamburger-btn {
                top: 18px;
                right: 18px;
                width: 42px;
                height: 42px;
                font-size: 16px;
            }

            .music-btn {
                bottom: 18px;
                right: 18px;
                width: 42px;
                height: 42px;
                font-size: 16px;
            }

            .full-menu a {
                font-size: 1.6rem;
                letter-spacing: 2px;
            }

            .carousel-viewport {
                padding: 24px 0;
            }

            .carousel-track {
                gap: 14px;
                padding: 0 calc(50vw - 92px);
            }

            .mode-poster {
                width: 184px;
                height: 270px;
                border-radius: 16px;
                transform: scale(0.86);
            }

            .mode-poster.is-neighbor {
                transform: scale(0.91);
            }

            .mode-poster.is-active {
                transform: scale(1.03);
            }

            .poster-title {
                font-size: 1.02rem;
                margin-bottom: 6px;
            }

            .tag-pill,
            .tag-sub {
                font-size: 0.62rem;
            }

            footer {
                font-size: 0.68rem;
                bottom: 10px;
            }
        }

        /* Reduced Motion Support */
        @media (prefers-reduced-motion: reduce) {
            .carousel-viewport {
                scroll-behavior: auto;
            }
            .mode-poster,
            .poster-media svg,
            .ambient-glow,
            .progress-fill {
                transition: none !important;
            }
        }
    </style>
</head>

    <!-- JAVASCRIPT -->
    <script>
        // Preserved Audio Logic
        let isMusicPlaying = sessionStorage.getItem('musicPlaying') === 'true';
        const bgMusic = document.getElementById('bgMusic');
        const musicIcon = document.getElementById('music-icon');

        if (isMusicPlaying) {
            bgMusic.play().catch(() => {
                isMusicPlaying = false;
                sessionStorage.setItem('musicPlaying', 'false');
            });
            musicIcon.classList.replace('fa-volume-xmark', 'fa-volume-high');
        }

        function toggleMusic() {
            if (isMusicPlaying) {
                bgMusic.pause();
                musicIcon.classList.replace('fa-volume-high', 'fa-volume-xmark');
                sessionStorage.setItem('musicPlaying', 'false');
            } else {
                bgMusic.play().catch(e => console.log("Audio play blocked by browser:", e));
                musicIcon.classList.replace('fa-volume-xmark', 'fa-volume-high');
                sessionStorage.setItem('musicPlaying', 'true');
            }
            isMusicPlaying = !isMusicPlaying;
        }

        // Preserved Navigation Menu Logic
        function toggleMenu() {
            const menu = document.getElementById('fullMenu');
            const icon = document.getElementById('menu-icon');
            const links = document.querySelectorAll('.full-menu a');
            
            menu.classList.toggle('open');
            
            if (menu.classList.contains('open')) {
                icon.classList.replace('fa-bars', 'fa-xmark');
                links.forEach((link, idx) => {
                    link.style.transitionDelay = `${idx * 0.06}s`;
                });
            } else {
                icon.classList.replace('fa-xmark', 'fa-bars');
                links.forEach(link => {
                    link.style.transitionDelay = '0s';
                });
            }
        }

        // All 26 Preserved Tic Tac Toe Game Links & Metadata
        const GAMES = [

            { name: "Memory Tic-Tac-Toe", href: "memory-tic-tac-toe.html", pill: "Blindfold", sub: "Hidden Marks", icon: "fa-brain", color: "#ec4899", bg: "#500724", glow: "rgba(236, 72, 153, 0.28)", art: "memory" }
        ];

        // Custom SVG Artwork Generator for Each Mode
        function buildPosterSVG(game, idx) {
            const c = game.color;
            const bg = game.bg;
            let motif = "";

            switch (game.art) {
                case "featured":
                    motif = `
                        <circle cx="200" cy="230" r="96" fill="none" stroke="${c}" stroke-width="2" stroke-opacity="0.28" stroke-dasharray="6 8"/>
                        <g stroke="rgba(255,255,255,0.22)" stroke-width="3" stroke-linecap="round">
                            <line x1="162" y1="138" x2="162" y2="322"/><line x1="238" y1="138" x2="238" y2="322"/>
                            <line x1="108" y1="192" x2="292" y2="192"/><line x1="108" y1="268" x2="292" y2="268"/>
                        </g>

                        <g stroke="${c}" stroke-width="6" stroke-linecap="round" filter="url(#glow${idx})">

                        <circle cx="227" cy="155" r="12" fill="none" stroke="#ff4466" stroke-width="5"/>
                        <circle cx="172" cy="255" r="12" fill="none" stroke="#ff4466" stroke-width="5"/>
                    `;
                    break;
                case "grid5":
                    motif = `
                        <g stroke="rgba(255,255,255,0.18)" stroke-width="2">
                            <line x1="136" y1="130" x2="136" y2="330"/><line x1="178" y1="130" x2="178" y2="330"/><line x1="222" y1="130" x2="222" y2="330"/><line x1="264" y1="130" x2="264" y2="330"/>
                            <line x1="95" y1="170" x2="305" y2="170"/><line x1="95" y1="210" x2="305" y2="210"/><line x1="95" y1="250" x2="305" y2="250"/><line x1="95" y1="290" x2="305" y2="290"/>
                        </g>
                        <circle cx="200" cy="230" r="12" fill="none" stroke="${c}" stroke-width="5" filter="url(#glow${idx})"/>
                        <circle cx="157" cy="190" r="12" fill="none" stroke="${c}" stroke-width="5" filter="url(#glow${idx})"/>
                        <circle cx="243" cy="270" r="12" fill="none" stroke="${c}" stroke-width="5" filter="url(#glow${idx})"/>
                        <line x1="108" y1="142" x2="292" y2="318" stroke="${c}" stroke-width="3.5" stroke-linecap="round" filter="url(#glow${idx})"/>
                    `;
                    break;
                case "cube":
                    motif = `
                        <g fill="rgba(255,255,255,0.03)" stroke="${c}" stroke-width="3" stroke-linejoin="round" filter="url(#glow${idx})">
                            <polygon points="200,130 295,168 200,206 105,168"/>
                            <polygon points="200,192 295,230 200,268 105,230" stroke-opacity="0.7"/>
                            <polygon points="200,254 295,292 200,330 105,292" stroke-opacity="0.45"/>
                        </g>
                        <circle cx="200" cy="168" r="7" fill="#fff"/>
                        <circle cx="200" cy="230" r="7" fill="${c}"/>
                        <circle cx="200" cy="292" r="7" fill="#ff4466"/>
                    `;
                    break;
                case "infinity":
                    motif = `
                        <path d="M145,230 C110,230 110,180 145,180 C175,180 225,280 255,280 C290,280 290,230 255,230 C225,230 175,180 145,180" 
                              fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round" filter="url(#glow${idx})"/>
                        <circle cx="145" cy="205" r="8" fill="#ffffff"/>
                        <circle cx="255" cy="255" r="8" fill="#ff4466"/>
                    `;
                    break;
                case "vanish":
                    motif = `
                        <g stroke="rgba(255,255,255,0.18)" stroke-width="2.5" stroke-dasharray="6 6">
                            <line x1="164" y1="138" x2="164" y2="322"/><line x1="236" y1="138" x2="236" y2="322"/>
                            <line x1="108" y1="194" x2="292" y2="194"/><line x1="108" y1="266" x2="292" y2="266"/>
                        </g>
                        <g stroke="${c}" stroke-width="8" stroke-linecap="round" filter="url(#glow${idx})">
                            <line x1="184" y1="214" x2="216" y2="246"/><line x1="216" y1="214" x2="184" y2="246"/>
                        </g>
                        <circle cx="136" cy="164" r="16" fill="none" stroke="${c}" stroke-width="6" stroke-opacity="0.45"/>
                        <circle cx="264" cy="296" r="16" fill="none" stroke="${c}" stroke-width="5" stroke-opacity="0.2" stroke-dasharray="5 5"/>
                    `;
                    break;
                case "ultimate":
                    motif = `
                        <g stroke="${c}" stroke-width="3.5" stroke-linecap="round" filter="url(#glow${idx})">
                            <line x1="162" y1="132" x2="162" y2="328"/><line x1="238" y1="132" x2="238" y2="328"/>
                            <line x1="102" y1="192" x2="298" y2="192"/><line x1="102" y1="268" x2="298" y2="268"/>
                        </g>
                        <g stroke="rgba(255,255,255,0.35)" stroke-width="1.5">
                            <line x1="190" y1="202" x2="190" y2="258"/><line x1="210" y1="202" x2="210" y2="258"/>
                            <line x1="172" y1="220" x2="228" y2="220"/><line x1="172" y1="240" x2="228" y2="240"/>
                        </g>
                    `;
                    break;
                case "onlyX":
                    motif = `
                        <g stroke="${c}" stroke-width="8" stroke-linecap="round" filter="url(#glow${idx})">
                            <line x1="122" y1="162" x2="154" y2="194"/><line x1="154" y1="162" x2="122" y2="194"/>
                            <line x1="184" y1="214" x2="216" y2="246"/><line x1="216" y1="214" x2="184" y2="246"/>
                            <line x1="246" y1="266" x2="278" y2="298"/><line x1="278" y1="266" x2="246" y2="298"/>
                        </g>
                    `;
                    break;
                case "gravity":
                    motif = `
                        <g stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-linecap="round">
                            <line x1="140" y1="140" x2="140" y2="320"/><line x1="200" y1="140" x2="200" y2="320"/><line x1="260" y1="140" x2="260" y2="320"/>
                            <line x1="105" y1="320" x2="295" y2="320"/>
                        </g>
                        <circle cx="170" cy="292" r="18" fill="none" stroke="${c}" stroke-width="6" filter="url(#glow${idx})"/>
                        <circle cx="230" cy="292" r="18" fill="none" stroke="#ff4466" stroke-width="6"/>
                        <circle cx="170" cy="195" r="18" fill="none" stroke="${c}" stroke-width="6" filter="url(#glow${idx})"/>
                        <line x1="170" y1="145" x2="170" y2="168" stroke="#ffffff" stroke-width="3" stroke-dasharray="4 4"/>
                    `;
                    break;
                case "quantum":
                    motif = `
                        <g fill="none" stroke="${c}" stroke-width="3" filter="url(#glow${idx})">
                            <ellipse cx="200" cy="230" rx="95" ry="38" transform="rotate(30 200 230)"/>
                            <ellipse cx="200" cy="230" rx="95" ry="38" transform="rotate(-30 200 230)"/>
                            <ellipse cx="200" cy="230" rx="95" ry="38" transform="rotate(90 200 230)" stroke-opacity="0.5"/>
                        </g>
                        <circle cx="200" cy="230" r="12" fill="#ffffff" filter="url(#glow${idx})"/>
                    `;
                    break;
                case "rotate":
                    motif = `
                        <circle cx="200" cy="230" r="82" fill="none" stroke="${c}" stroke-width="5" stroke-dasharray="160 40" stroke-linecap="round" filter="url(#glow${idx})"/>
                        <g stroke="#ffffff" stroke-width="6" stroke-linecap="round">
                            <line x1="184" y1="214" x2="216" y2="246"/><line x1="216" y1="214" x2="184" y2="246"/>
                        </g>
                    `;
                    break;
                case "fourP":
                    motif = `
                        <circle cx="155" cy="185" r="22" fill="none" stroke="#00eaff" stroke-width="6" filter="url(#glow${idx})"/>
                        <circle cx="245" cy="185" r="22" fill="none" stroke="#ff4466" stroke-width="6"/>
                        <polygon points="155,252 177,292 133,292" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linejoin="round"/>
                        <rect x="225" y="252" width="40" height="40" rx="6" fill="none" stroke="#10b981" stroke-width="6"/>
                    `;
                    break;
                case "clock":
                    motif = `
                        <circle cx="200" cy="230" r="78" fill="none" stroke="${c}" stroke-width="5" filter="url(#glow${idx})"/>
                        <polyline points="200,182 200,230 236,248" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                    `;
                    break;
                case "power":
                    motif = `
                        <polygon points="215,135 142,238 198,238 182,325 258,218 202,218" fill="rgba(168, 85, 247, 0.2)" stroke="${c}" stroke-width="5" stroke-linejoin="round" filter="url(#glow${idx})"/>
                    `;
                    break;
                case "blocked":
                    motif = `
                        <rect x="135" y="165" width="130" height="130" rx="18" fill="rgba(255,255,255,0.04)" stroke="${c}" stroke-width="4"/>
                        <circle cx="200" cy="230" r="38" fill="none" stroke="#ef4444" stroke-width="6" filter="url(#glow${idx})"/>
                        <line x1="174" y1="204" x2="226" y2="256" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
                    `;
                    break;
                case "ai":
                    motif = `
                        <rect x="148" y="178" width="104" height="104" rx="16" fill="rgba(0, 234, 255, 0.1)" stroke="${c}" stroke-width="4" filter="url(#glow${idx})"/>
                        <g stroke="${c}" stroke-width="3" stroke-linecap="round">
                            <line x1="175" y1="145" x2="175" y2="178"/><line x1="200" y1="145" x2="200" y2="178"/><line x1="225" y1="145" x2="225" y2="178"/>
                            <line x1="175" y1="282" x2="175" y2="315"/><line x1="200" y1="282" x2="200" y2="315"/><line x1="225" y1="282" x2="225" y2="315"/>
                            <line x1="115" y1="205" x2="148" y2="205"/><line x1="115" y1="230" x2="148" y2="230"/><line x1="115" y1="255" x2="148" y2="255"/>
                            <line x1="252" y1="205" x2="285" y2="205"/><line x1="252" y1="230" x2="285" y2="230"/><line x1="252" y1="255" x2="285" y2="255"/>
                        </g>
                        <circle cx="200" cy="230" r="18" fill="none" stroke="#ffffff" stroke-width="5"/>
                    `;
                    break;
                case "online":
                    motif = `
                        <circle cx="200" cy="230" r="78" fill="none" stroke="${c}" stroke-width="4" filter="url(#glow${idx})"/>
                        <ellipse cx="200" cy="230" rx="38" ry="78" fill="none" stroke="${c}" stroke-width="2.5"/>
                        <line x1="122" y1="230" x2="278" y2="230" stroke="${c}" stroke-width="2.5"/>
                    `;
                    break;
                case "memory":
                    motif = `
                        <rect x="115" y="160" width="76" height="96" rx="10" fill="rgba(255,255,255,0.06)" stroke="${c}" stroke-width="3.5" filter="url(#glow${idx})"/>
                        <rect x="209" y="195" width="76" height="96" rx="10" fill="rgba(255,255,255,0.06)" stroke="#ffffff" stroke-width="3.5"/>
                        <text x="153" y="220" text-anchor="middle" fill="${c}" font-size="34" font-weight="700" font-family="sans-serif">?</text>
                        <text x="247" y="255" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="700" font-family="sans-serif">X</text>
                    `;
                    break;
                default:
                    motif = `
                        <g stroke="rgba(255,255,255,0.22)" stroke-width="3" stroke-linecap="round">
                            <line x1="164" y1="138" x2="164" y2="322"/><line x1="236" y1="138" x2="236" y2="322"/>
                            <line x1="108" y1="194" x2="292" y2="194"/><line x1="108" y1="266" x2="292" y2="266"/>
                        </g>
                        <g stroke="${c}" stroke-width="8" stroke-linecap="round" filter="url(#glow${idx})">
                            <line x1="184" y1="214" x2="216" y2="246"/><line x1="216" y1="214" x2="184" y2="246"/>
                        </g>
                        <circle cx="264" cy="164" r="16" fill="none" stroke="#ff4466" stroke-width="6"/>
                        <circle cx="136" cy="296" r="16" fill="none" stroke="${c}" stroke-width="6"/>
                    `;
            }

            return `
                <svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${game.name}">
                    <defs>
                        <radialGradient id="bg${idx}" cx="50%" cy="38%" r="72%">
                            <stop offset="0%" stop-color="${bg}"/>
                            <stop offset="58%" stop-color="#070c18"/>
                            <stop offset="100%" stop-color="#03050a"/>
                        </radialGradient>
                        <filter id="glow${idx}" x="-25%" y="-25%" width="150%" height="150%">
                            <feGaussianBlur stdDeviation="6" result="blur"/>
                            <feMerge>
                                <feMergeNode in="blur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    <rect width="400" height="600" fill="url(#bg${idx})"/>
                    ${motif}
                </svg>
            `;
        }

        // Render Carousel Cards
        const track = document.getElementById('carouselTrack');
        GAMES.forEach((game, idx) => {
            const card = document.createElement('a');
            card.href = game.href;
            card.className = 'mode-poster' + (idx === 0 ? ' is-active' : '');
            card.setAttribute('data-index', idx);
            card.setAttribute('data-glow', game.glow);
            card.innerHTML = `
                <div class="poster-media">
                    ${buildPosterSVG(game, idx)}
                </div>
                <div class="poster-shade"></div>
                <div class="poster-top">
                    <span class="mode-emblem" style="background: ${game.color}; color: #04060c;">
                        <i class="fa-solid ${game.icon}"></i>
                    </span>
                </div>
                <div class="poster-info">
                    <h2 class="poster-title">${game.name}</h2>
                    <div class="poster-tags">
                        <span class="tag-pill">${game.pill}</span>
                        <span class="tag-sub">${game.sub}</span>
                    </div>
                </div>
            `;
            track.appendChild(card);
        });

        // Lightweight Carousel Controller
        const viewport = document.getElementById('carouselViewport');
        const posters = Array.from(document.querySelectorAll('.mode-poster'));
        const ambientGlow = document.getElementById('ambientGlow');
        const progressFill = document.getElementById('progressFill');
        const counterLabel = document.getElementById('counterLabel');
        let activeIndex = 0;
        let scrollTicking = false;

        function setActiveCard(index) {
            if (index < 0 || index >= posters.length) return;
            activeIndex = index;

            posters.forEach((poster, idx) => {
                poster.classList.toggle('is-active', idx === activeIndex);
                poster.classList.toggle('is-neighbor', Math.abs(idx - activeIndex) === 1);
            });

            const glow = posters[activeIndex].getAttribute('data-glow');
            if (glow) {
                ambientGlow.style.setProperty('--active-glow', glow);
            }

            const pct = ((activeIndex + 1) / posters.length) * 100;
            progressFill.style.width = `${pct}%`;
            counterLabel.textContent = `${String(activeIndex + 1).padStart(2, '0')} / ${posters.length}`;
        }

        function centerCard(index, smooth = true) {
            const card = posters[index];
            if (!card) return;
            const targetLeft = card.offsetLeft - (viewport.clientWidth - card.offsetWidth) / 2;
            viewport.scrollTo({
                left: targetLeft,
                behavior: smooth ? 'smooth' : 'auto'
            });
            setActiveCard(index);
        }

        function updateActiveFromScroll() {
            const viewportCenter = viewport.scrollLeft + viewport.clientWidth / 2;
            let closestIdx = activeIndex;
            let minDistance = Infinity;

            posters.forEach((poster, idx) => {
                const cardCenter = poster.offsetLeft + poster.offsetWidth / 2;
                const dist = Math.abs(viewportCenter - cardCenter);
                if (dist < minDistance) {
                    minDistance = dist;
                    closestIdx = idx;
                }
            });

            if (closestIdx !== activeIndex) {
                setActiveCard(closestIdx);
            }
            scrollTicking = false;
        }

        viewport.addEventListener('scroll', () => {
            if (!scrollTicking) {
                window.requestAnimationFrame(updateActiveFromScroll);
                scrollTicking = true;
            }
        }, { passive: true });

        viewport.addEventListener('wheel', (e) => {
            if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
                e.preventDefault();
                viewport.scrollLeft += e.deltaY;
            }
        }, { passive: false });

        posters.forEach((poster, idx) => {
            poster.addEventListener('click', (e) => {
                if (idx !== activeIndex) {
                    e.preventDefault();
                    centerCard(idx, true);
                }
            });

            poster.addEventListener('mouseenter', () => {
                if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
                    setActiveCard(idx);
                }
            });
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && activeIndex < posters.length - 1) {
                centerCard(activeIndex + 1, true);
            } else if (e.key === 'ArrowLeft' && activeIndex > 0) {
                centerCard(activeIndex - 1, true);
            }
        });

        window.addEventListener('load', () => centerCard(0, false));
        window.addEventListener('resize', () => centerCard(activeIndex, false));
    </script>
</body>
</html>
