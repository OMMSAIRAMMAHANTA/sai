<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Omm Sairam Mahanta | Games</title>
    
    <!-- Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-accent: #00eaff;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.62);
            --bg-dark: #040508;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-main);
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* Deep Black Background with Subtle Red & Blue Ambient Lighting */
        .ambient-stage {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: 
                radial-gradient(circle at 50% 46%, rgba(190, 24, 38, 0.22) 0%, rgba(120, 15, 28, 0.08) 36%, transparent 68%),
                radial-gradient(circle at 22% 65%, rgba(29, 78, 216, 0.14) 0%, transparent 55%),
                radial-gradient(circle at 78% 35%, rgba(0, 234, 255, 0.1) 0%, transparent 55%),
                linear-gradient(180deg, #030407 0%, #070910 50%, #030407 100%);
        }

        .ambient-glow {
            position: fixed;
            top: 48%;
            left: 50%;
            width: min(560px, 90vw);
            height: min(380px, 60vh);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, var(--active-glow, rgba(220, 38, 38, 0.24)) 0%, transparent 70%);
            z-index: 1;
            pointer-events: none;
            transition: background 0.5s ease;
        }

        /* Preserved Navigation & Music Floating Controls */
        .hamburger-btn,
        .music-btn {
            position: fixed;
            right: 28px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(8, 12, 22, 0.78);
            border: 1.5px solid var(--primary-accent);
            color: var(--primary-accent);
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(0, 234, 255, 0.18);
            transition: transform 0.3s ease, background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
        }

        .hamburger-btn {
            top: 28px;
            z-index: 10000;
        }

        .music-btn {
            bottom: 28px;
            z-index: 9997;
        }

        .hamburger-btn:hover,
        .music-btn:hover {
            transform: scale(1.08);
            background: var(--primary-accent);
            color: #000;
            box-shadow: 0 0 22px rgba(0, 234, 255, 0.5);
        }

        /* Preserved Full Screen Menu */
        .full-menu {
            position: fixed;
            inset: 0;
            background: rgba(3, 5, 10, 0.97);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 32px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        .full-menu.open {
            opacity: 1;
            pointer-events: all;
        }

        .full-menu a {
            font-size: 2.2rem;
            color: transparent;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.32);
            opacity: 0;
            transform: translateY(24px);
            transition: color 0.3s ease, -webkit-text-stroke 0.3s ease, transform 0.3s ease, letter-spacing 0.3s ease;
        }

        .full-menu.open a {
            opacity: 1;
            transform: translateY(0);
        }

        .full-menu a:hover,
        .full-menu a.active-link {
            color: var(--primary-accent);
            -webkit-text-stroke: 1.5px var(--primary-accent);
            text-shadow: 0 0 18px rgba(0, 234, 255, 0.45);
            transform: scale(1.04);
            letter-spacing: 5px;
        }

        /* Main Showcase Container */
        .content-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .carousel-viewport {
            width: 100%;
            display: flex;
            align-items: center;
            overflow-x: auto;
            overflow-y: visible;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding: 36px 0;
            cursor: grab;
        }

        .carousel-viewport:active {
            cursor: grabbing;
        }

        .carousel-viewport::-webkit-scrollbar {
            display: none;
        }

        .carousel-track {
            display: flex;
            align-items: center;
            gap: 22px;
            padding: 0 calc(50vw - 115px);
            margin: 0 auto;
        }

        /* Poster Card */
        .game-poster {
            position: relative;
            width: 230px;
            height: 334px;
            border-radius: 18px;
            overflow: hidden;
            flex-shrink: 0;
            scroll-snap-align: center;
            text-decoration: none;
            color: #fff;
            background: #0c1018;
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.72);
            transform: scale(0.84);
            opacity: 0.46;
            filter: brightness(0.72) saturate(0.85);
            transition: 
                transform 0.42s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.42s cubic-bezier(0.22, 1, 0.36, 1),
                filter 0.42s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 0.35s ease,
                box-shadow 0.42s ease;
            will-change: transform, opacity;
        }

        .game-poster.is-neighbor {
            transform: scale(0.9);
            opacity: 0.72;
            filter: brightness(0.86) saturate(0.95);
        }

        .game-poster.is-active {
            transform: scale(1.06);
            opacity: 1;
            filter: brightness(1) saturate(1.05);
            border-color: rgba(255, 255, 255, 0.24);
            box-shadow: 0 26px 56px rgba(0, 0, 0, 0.88), 0 0 32px rgba(255, 255, 255, 0.06);
            z-index: 5;
        }

        .poster-media {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .poster-media img,
        .poster-media svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .game-poster.is-active:hover .poster-media img,
        .game-poster.is-active:hover .poster-media svg {
            transform: scale(1.04);
        }

        /* Dark Gradient Overlay for Text Readability */
        .poster-shade {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(4, 6, 12, 0.32) 0%,
                rgba(4, 6, 12, 0.02) 34%,
                rgba(4, 6, 12, 0.68) 72%,
                rgba(3, 5, 10, 0.96) 100%
            );
            pointer-events: none;
        }

        /* Subtle Top Icon Badge */
        .poster-top {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
            pointer-events: none;
        }

        .game-emblem {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
        }

        /* Bottom Info Overlay */
        .poster-info {
            position: absolute;
            left: 16px;
            right: 16px;
            bottom: 16px;
            z-index: 2;
            pointer-events: none;
        }

        .poster-title {
            font-size: 1.22rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.2;
            color: #ffffff;
            margin-bottom: 8px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85);
        }

        .poster-tags {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tag-pill {
            font-size: 0.68rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.82);
            background: rgba(255, 255, 255, 0.12);
            padding: 3px 9px;
            border-radius: 999px;
            letter-spacing: 0.01em;
        }

        .tag-sub {
            font-size: 0.68rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        /* Subtle Indicator Dots */
        .carousel-dots {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-top: 8px;
            z-index: 10;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.22);
            border: none;
            padding: 0;
            cursor: pointer;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .dot.active {
            width: 20px;
            background: rgba(255, 255, 255, 0.85);
        }

        footer {
            position: fixed;
            bottom: 14px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.28);
            font-size: 0.74rem;
            letter-spacing: 0.6px;
            pointer-events: none;
            z-index: 5;
        }

        /* Compact Mobile Optimization */
        @media (max-width: 640px) {
            .hamburger-btn {
                top: 18px;
                right: 18px;
                width: 42px;
                height: 42px;
                font-size: 16px;
            }

            .music-btn {
                bottom: 18px;
                right: 18px;
                width: 42px;
                height: 42px;
                font-size: 16px;
            }

            .full-menu a {
                font-size: 1.6rem;
                letter-spacing: 2px;
            }

            .carousel-viewport {
                padding: 24px 0;
            }

            .carousel-track {
                gap: 14px;
                /* Shows active compact card centered with neighboring cards peeking on both sides */
                padding: 0 calc(50vw - 92px);
            }

            .game-poster {
                width: 184px;
                height: 270px;
                border-radius: 16px;
                transform: scale(0.86);
            }

            .game-poster.is-neighbor {
                transform: scale(0.91);
            }

            .game-poster.is-active {
                transform: scale(1.03);
            }

            .poster-title {
                font-size: 1.06rem;
                margin-bottom: 6px;
            }

            .tag-pill,
            .tag-sub {
                font-size: 0.63rem;
            }

            footer {
                font-size: 0.68rem;
                bottom: 10px;
            }
        }

        /* Reduced Motion Support */
        @media (prefers-reduced-motion: reduce) {
            .carousel-viewport {
                scroll-behavior: auto;
            }
            .game-poster,
            .poster-media img,
            .poster-media svg,
            .ambient-glow,
            .dot {
                transition: none !important;
            }
        }
    </style>
</head>

                                  stroke-linejoin="round"
                                  filter="url(#snakeGlow)"/>
                            <!-- Snake Eyes -->
                            <circle cx="294" cy="174" r="3" fill="#03110d"/>
                            <circle cx="294" cy="186" r="3" fill="#03110d"/>
                            <!-- Glowing Energy Apple -->
                            <circle cx="320" cy="125" r="11" fill="#ff2a5f" filter="url(#snakeGlow)"/>
                        </svg>
                    </div>
                    <div class="poster-shade"></div>
                    <div class="poster-top">
                        <span class="game-emblem" style="background: #059669;">
                            <i class="fa-solid fa-staff-snake"></i>
                        </span>
                    </div>
                    <div class="poster-info">
                        <h2 class="poster-title">Neon Snake</h2>
                        <div class="poster-tags">
                            <span class="tag-pill">Arcade</span>
                            <span class="tag-sub">Classic</span>
                        </div>
                    </div>
                </a>

            </div>
        </div>

        <!-- Subtle Carousel Indicators -->
        <div class="carousel-dots" id="carouselDots" role="tablist" aria-label="Select Game">
            <button class="dot" data-index="0" aria-label="Super Tic Tac Toe"></button>
            <button class="dot active" data-index="1" aria-label="Sai's Chess"></button>
            <button class="dot" data-index="2" aria-label="Memory Master"></button>
            <button class="dot" data-index="3" aria-label="Neon Snake"></button>
        </div>

        <footer>&copy; 2026 Omm Sairam Mahanta | AstraGoo Network. All Rights Reserved.</footer>
    </main>

    <!-- JAVASCRIPT -->
    <script>
        // Preserved Audio Logic
        let isMusicPlaying = sessionStorage.getItem('musicPlaying') === 'true';
        const bgMusic = document.getElementById('bgMusic');
        const musicIcon = document.getElementById('music-icon');

        if (isMusicPlaying) {
            bgMusic.play().catch(() => {
                isMusicPlaying = false;
                sessionStorage.setItem('musicPlaying', 'false');
            });
            musicIcon.classList.replace('fa-volume-xmark', 'fa-volume-high');
        }

        function toggleMusic() {
            if (isMusicPlaying) {
                bgMusic.pause();
                musicIcon.classList.replace('fa-volume-high', 'fa-volume-xmark');
                sessionStorage.setItem('musicPlaying', 'false');
            } else {
                bgMusic.play().catch(e => console.log("Audio play blocked by browser:", e));
                musicIcon.classList.replace('fa-volume-xmark', 'fa-volume-high');
                sessionStorage.setItem('musicPlaying', 'true');
            }
            isMusicPlaying = !isMusicPlaying;
        }

        // Preserved Navigation Menu Logic
        function toggleMenu() {
            const menu = document.getElementById('fullMenu');
            const icon = document.getElementById('menu-icon');
            const links = document.querySelectorAll('.full-menu a');
            
            menu.classList.toggle('open');
            
            if (menu.classList.contains('open')) {
                icon.classList.replace('fa-bars', 'fa-xmark');
                links.forEach((link, idx) => {
                    link.style.transitionDelay = `${idx * 0.06}s`;
                });
            } else {
                icon.classList.replace('fa-xmark', 'fa-bars');
                links.forEach(link => {
                    link.style.transitionDelay = '0s';
                });
            }
        }

        // Lightweight Carousel Controller
        const viewport = document.getElementById('carouselViewport');
        const posters = Array.from(document.querySelectorAll('.game-poster'));
        const dots = Array.from(document.querySelectorAll('.dot'));
        const ambientGlow = document.getElementById('ambientGlow');
        let activeIndex = 1;
        let scrollTicking = false;

        function setActiveCard(index) {
            if (index < 0 || index >= posters.length) return;
            activeIndex = index;

            posters.forEach((poster, idx) => {
                poster.classList.toggle('is-active', idx === activeIndex);
                poster.classList.toggle('is-neighbor', Math.abs(idx - activeIndex) === 1);
            });

            dots.forEach((dot, idx) => {
                dot.classList.toggle('active', idx === activeIndex);
            });

            const glow = posters[activeIndex].getAttribute('data-glow');
            if (glow) {
                ambientGlow.style.setProperty('--active-glow', glow);
            }
        }

        function centerCard(index, smooth = true) {
            const card = posters[index];
            if (!card) return;
            const targetLeft = card.offsetLeft - (viewport.clientWidth - card.offsetWidth) / 2;
            viewport.scrollTo({
                left: targetLeft,
                behavior: smooth ? 'smooth' : 'auto'
            });
            setActiveCard(index);
        }

        // Detect closest card to viewport center during native touch/scroll
        function updateActiveFromScroll() {
            const viewportCenter = viewport.scrollLeft + viewport.clientWidth / 2;
            let closestIdx = activeIndex;
            let minDistance = Infinity;

            posters.forEach((poster, idx) => {
                const cardCenter = poster.offsetLeft + poster.offsetWidth / 2;
                const dist = Math.abs(viewportCenter - cardCenter);
                if (dist < minDistance) {
                    minDistance = dist;
                    closestIdx = idx;
                }
            });

            if (closestIdx !== activeIndex) {
                setActiveCard(closestIdx);
            }
            scrollTicking = false;
        }

        viewport.addEventListener('scroll', () => {
            if (!scrollTicking) {
                window.requestAnimationFrame(updateActiveFromScroll);
                scrollTicking = true;
            }
        }, { passive: true });

        // Horizontal wheel support on desktop
        viewport.addEventListener('wheel', (e) => {
            if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
                e.preventDefault();
                viewport.scrollLeft += e.deltaY;
            }
        }, { passive: false });

        // Click behavior: clicking an inactive side card centers it first; clicking the active card opens the game
        posters.forEach((poster, idx) => {
            poster.addEventListener('click', (e) => {
                if (idx !== activeIndex) {
                    e.preventDefault();
                    centerCard(idx, true);
                }
            });

            // Desktop hover focus
            poster.addEventListener('mouseenter', () => {
                if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
                    setActiveCard(idx);
                }
            });
        });

        dots.forEach((dot, idx) => {
            dot.addEventListener('click', () => centerCard(idx, true));
        });

        // Keyboard arrow navigation
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && activeIndex < posters.length - 1) {
                centerCard(activeIndex + 1, true);
            } else if (e.key === 'ArrowLeft' && activeIndex > 0) {
                centerCard(activeIndex - 1, true);
            }
        });

        // Center default featured game (Sai's Chess) on load & resize
        window.addEventListener('load', () => centerCard(1, false));
        window.addEventListener('resize', () => centerCard(activeIndex, false));
    </script>
</body>
</html>
